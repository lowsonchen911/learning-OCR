<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-md mx-auto space-y-4">
        <header class="text-center py-2">
            <h1 class="text-xl font-black text-indigo-600 italic">小三英文 AI 助手</h1>
            <p class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">Version: 2026.04.24-23 (Auto-Model Recovery)</p>
        </header>

        <div id="setupArea" class="bg-white p-6 rounded-[2rem] shadow-xl border border-white">
            <label class="block text-xs font-bold text-gray-400 mb-2">請貼入全新的 API KEY</label>
            <input type="password" id="apiKeyIn" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-sm" placeholder="AIza...">
            <button onclick="initApp()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">儲存金鑰並掃描權限</button>
            <p class="text-[10px] text-red-500 mt-2 text-center">請務必使用從 AI Studio 新申請的 Key</p>
        </div>

        <div id="mainUI" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-[2rem] shadow-xl text-center relative overflow-hidden">
                <div id="modelStatus" class="text-[10px] bg-indigo-50 text-indigo-600 py-1 px-3 rounded-full inline-block font-bold mb-4 uppercase">自動選取模型中...</div>
                
                <input type="file" id="fileIn" accept="image/*" class="hidden" onchange="runOCR(event)">
                <button id="scanBtn" onclick="document.getElementById('fileIn').click()" class="w-full bg-indigo-600 text-white py-8 rounded-[1.5rem] font-bold shadow-lg active:scale-95 transition-all">
                    <i class="fas fa-camera text-2xl mb-2"></i><br>拍照辨識單字
                </button>

                <div id="loader" class="hidden py-8">
                    <i class="fas fa-circle-notch spin text-indigo-500 text-3xl mb-2"></i>
                    <p class="text-indigo-600 font-bold animate-pulse text-sm">正在辨識中，請稍候...</p>
                </div>
                
                <button onclick="resetKey()" class="text-[10px] text-gray-300 mt-6 underline">重設 API Key</button>
            </div>

            <div id="listArea" class="space-y-2"></div>
        </div>

        <div class="bg-slate-900 rounded-2xl p-4 h-48 overflow-y-auto font-mono text-[9px] text-green-400" id="log">
            [SYSTEM] 等待初始化...
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('study_v23_db') || '[]');
        let activeModel = "";

        const log = (msg, isErr = false) => {
            const div = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = isErr ? 'text-red-400' : 'text-green-400';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(entry);
            div.scrollTop = div.scrollHeight;
        };

        window.onload = () => {
            if(localStorage.getItem('user_key_v23')) {
                initApp();
            }
            renderList();
        };

        async function initApp() {
            const key = document.getElementById('apiKeyIn').value.trim() || localStorage.getItem('user_key_v23');
            if(!key) return;

            log("正在連線 Google 獲取可用模型清單...");
            try {
                // 優先嘗試 v1beta
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await resp.json();

                if(data.error) throw new Error(data.error.message);

                // 自動挑選 1.5 Flash 或 2.0 Flash
                const flashModels = data.models.filter(m => m.name.includes('flash'));
                if(flashModels.length > 0) {
                    // 優先順序：1.5-flash > 2.0-flash (因為 1.5 目前配額最穩)
                    const target = flashModels.find(m => m.name.includes('1.5-flash')) || flashModels[0];
                    activeModel = target.name;
                    document.getElementById('modelStatus').innerText = `已對接：${target.displayName}`;
                    log(`選用模型: ${activeModel}`);
                }

                localStorage.setItem('user_key_v23', key);
                document.getElementById('setupArea').classList.add('hidden');
                document.getElementById('mainUI').classList.remove('hidden');
                log("初始化成功，系統就緒。");

            } catch(e) {
                log("初始化失敗：" + e.message, true);
                if(e.message.includes("leaked")) alert("警告：你的 API Key 已失效(leaked)，請去 AI Studio 申請一個全新的！");
            }
        }

        async function runOCR(e) {
            const file = e.target.files[0];
            if(!file || !activeModel) return;

            const btn = document.getElementById('scanBtn');
            const loader = document.getElementById('loader');
            btn.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const base64 = await compress(file, 800);
                const key = localStorage.getItem('user_key_v23');
                
                // 使用 v1beta 搭配自動偵測到的模型名稱
                const url = `https://generativelanguage.googleapis.com/v1beta/${activeModel}:generateContent?key=${key}`;
                
                log(`發送請求至 ${activeModel}...`);
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "辨識英文考卷單字與翻譯。輸出：英文 | 翻譯" },
                                   { inline_data: { mime_type: "image/jpeg", data: base64.split(',')[1] } }]
                        }]
                    })
                });

                const result = await resp.json();
                if(result.error) throw new Error(result.error.message);

                const aiText = result.candidates[0].content.parts[0].text;
                log("辨識成功！正在加入題庫...");
                processText(aiText);

            } catch(err) {
                log("!! 錯誤：" + err.message, true);
                alert("辨識失敗：" + err.message);
            } finally {
                btn.classList.remove('hidden');
                loader.classList.add('hidden');
                e.target.value = '';
            }
        }

        function processText(text) {
            text.split('\n').forEach(line => {
                if(line.includes('|')) {
                    let [word, trans] = line.split('|').map(s => s.trim());
                    if(word && trans) db.push({ id: Date.now()+Math.random(), word, trans });
                }
            });
            localStorage.setItem('study_v23_db', JSON.stringify(db));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('listArea');
            container.innerHTML = db.slice().reverse().map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border-l-4 border-indigo-500">
                    <div>
                        <div class="font-bold text-indigo-900">${item.word}</div>
                        <div class="text-[10px] text-gray-400">${item.trans}</div>
                    </div>
                    <button onclick="speak('${item.word}')" class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center active:scale-90"><i class="fas fa-volume-up"></i></button>
                </div>
            `).join('');
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        function compress(file, maxWidth) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        function resetKey() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
