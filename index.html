<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手 V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .correct-flash { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
        .btn-disabled { opacity: 0.4 !important; cursor: not-allowed !important; pointer-events: none; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-indigo-700 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center">
                    <i class="fas fa-rocket mr-2 text-yellow-300"></i>AI 助手 V2
                </h1>
                <p class="text-[9px] text-indigo-300 font-bold uppercase tracking-widest">Version: 2026.04.24-V2 (Context Quiz)</p>
            </div>
            <button onclick="window.toggleSettings()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full"><i class="fas fa-cog text-xl text-yellow-300"></i></button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        
        <section id="settingsSection" class="hidden mb-6 bg-slate-800 text-white rounded-3xl p-6 shadow-2xl">
            <h3 class="font-bold flex items-center mb-4"><i class="fas fa-key mr-2 text-yellow-400"></i> API 管理</h3>
            <input type="password" id="apiKeyInput" placeholder="在此貼入 API Key" class="w-full bg-slate-700 border-none rounded-xl p-4 text-sm mb-4 outline-none text-white">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="window.saveSettings()" class="col-span-2 bg-yellow-500 text-slate-900 py-3 rounded-xl font-bold">儲存設定</button>
                <button onclick="window.exportData()" class="bg-slate-700 py-2 rounded-xl text-xs">備份題庫</button>
                <button onclick="window.fullReset()" class="bg-red-500/20 text-red-400 py-2 rounded-xl text-xs">清空全部</button>
            </div>
        </section>

        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-200 text-center">
                <div id="idleUI">
                    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-camera text-3xl"></i></div>
                    <h2 class="font-bold text-slate-700 text-lg mb-6">掃瞄並生成情境題</h2>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="window.handleAiUpload(event)">
                    <button id="mainScanBtn" onclick="window.checkBeforeUpload()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
                        <i class="fas fa-magic mr-2 text-yellow-300"></i> 開始 AI 辨識
                    </button>
                    <p id="quotaTip" class="text-[10px] text-red-500 mt-3 hidden font-bold italic">配額保護中，請稍候...</p>
                </div>

                <div id="loadingUI" class="hidden py-10">
                    <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-600 mb-4"></i>
                    <p class="text-indigo-600 font-bold animate-pulse text-lg">AI 正在造句中...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200/50 p-1 rounded-2xl mb-6">
            <button onclick="window.switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600">題庫單字</button>
            <button onclick="window.startQuiz()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500">情境測驗</button>
        </div>

        <section id="listPage">
            <div id="itemList" class="space-y-3"></div>
        </section>

        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[3rem] shadow-2xl p-8 text-center min-h-[500px] flex flex-col justify-center border border-indigo-50"></div>
        </section>

    </main>

    <script type="module">
        let db = JSON.parse(localStorage.getItem('studyDB_v2')) || [];
        let lastRequestTime = parseInt(localStorage.getItem('last_req_v2')) || 0;
        let activeModel = "models/gemini-1.5-flash";

        window.onload = async () => {
            const key = localStorage.getItem('user_key_v2');
            if (key) {
                document.getElementById('apiKeyInput').value = key;
                detectModel(key);
            } else window.toggleSettings(true);
            updateUI();
            checkCooldown();
        };

        async function detectModel(key) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const d = await r.json();
                const m = d.models.find(i => i.name.includes('1.5-flash'));
                if(m) activeModel = m.name;
            } catch(e) {}
        }

        window.saveSettings = () => {
            const k = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('user_key_v2', k);
            alert("設定已儲存！");
            location.reload();
        };

        window.checkBeforeUpload = () => {
            if (Date.now() - lastRequestTime < 40000) return alert("請再等幾秒，AI 需要休息。");
            document.getElementById('cameraInput').click();
        };

        window.handleAiUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            toggleLoader(true);
            const key = localStorage.getItem('user_key_v2');
            
            try {
                const base64 = await compressImage(file, 800);
                const url = `https://generativelanguage.googleapis.com/v1beta/${activeModel}:generateContent?key=${key}`;
                
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "辨識圖片中的英文單字。請過濾掉所有非英文單字的雜訊(如題號、括號)。針對每個單字，請提供：單字 | 繁體中文翻譯 | 一句適合國小程度的簡單英文例句。每行一組。" },
                                   { inline_data: { mime_type: "image/jpeg", data: base64.split(',')[1] } }]
                        }]
                    })
                });

                const data = await resp.json();
                processResponse(data.candidates[0].content.parts[0].text);
                
                lastRequestTime = Date.now();
                localStorage.setItem('last_req_v2', lastRequestTime);
                startCooldown(45);
                alert("辨識成功！情境例句已生成。");
            } catch (err) {
                alert("辨識失敗，請檢查 Key 或等待冷卻。");
            } finally {
                toggleLoader(false);
                e.target.value = '';
            }
        };

        function processResponse(text) {
            text.split('\n').forEach(line => {
                if (line.includes('|')) {
                    let parts = line.split('|').map(s => s.trim());
                    if (parts.length >= 3) {
                        let word = parts[0].replace(/[^a-zA-Z]/g, ''); // 強制只留英文字母
                        db.push({ id: Date.now() + Math.random(), word, trans: parts[1], sentence: parts[2] });
                    }
                }
            });
            saveDB();
        }

        window.saveDB = () => {
            localStorage.setItem('studyDB_v2', JSON.stringify(db));
            updateUI();
        };

        function updateUI() {
            const list = document.getElementById('itemList');
            list.innerHTML = db.slice().reverse().map(item => `
                <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                    <div onclick="window.speak('${item.word}')" class="flex-1 cursor-pointer">
                        <div class="font-bold text-indigo-900 text-lg">${item.word}</div>
                        <div class="text-[10px] text-slate-400 font-medium">${item.trans}</div>
                        <div class="text-[10px] text-indigo-400 italic mt-1">${item.sentence}</div>
                    </div>
                    <button onclick="window.deleteItem(${item.id})" class="text-slate-200 p-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
        }

        window.deleteItem = (id) => {
            if(confirm("刪除？")) { db = db.filter(i => i.id !== id); window.saveDB(); }
        };

        window.startQuiz = () => {
            if (db.length === 0) return alert("題庫是空的。");
            renderQuiz(0);
            window.switchTab('quiz');
        };

        function renderQuiz(idx) {
            const item = db[idx];
            const card = document.getElementById('quizCard');
            // 將句子中的目標單字挖空
            const displaySentence = item.sentence.replace(new RegExp(item.word, 'gi'), '______');
            
            card.innerHTML = `
                <div class="text-slate-300 text-[10px] mb-8 font-bold uppercase tracking-widest">Question ${idx + 1} / ${db.length}</div>
                <div class="mb-10">
                    <button onclick="window.speak('${item.sentence}')" class="w-20 h-20 bg-indigo-600 text-white rounded-full mx-auto mb-6 shadow-xl">
                        <i class="fas fa-volume-up text-2xl"></i>
                    </button>
                    <div class="text-slate-400 text-xs mb-2">請根據句子填入正確單字：</div>
                    <div class="text-indigo-900 font-bold text-xl leading-relaxed px-4 mb-4">${displaySentence}</div>
                    <div class="text-indigo-400 text-sm font-medium">(${item.trans})</div>
                </div>
                <input type="text" id="ansIn" class="w-full border-b-4 border-indigo-100 text-3xl text-center p-2 mb-10 outline-none focus:border-indigo-500 uppercase font-bold" placeholder="ANSWER" autocomplete="off">
                <button onclick="window.checkAns(${idx})" class="w-full bg-slate-900 text-white py-5 rounded-3xl font-bold text-xl shadow-lg">檢查答案</button>
            `;
            window.speak(item.sentence);
            setTimeout(() => document.getElementById('ansIn').focus(), 400);
        }

        window.checkAns = (idx) => {
            const user = document.getElementById('ansIn').value.trim().toLowerCase();
            const correct = db[idx].word.toLowerCase();
            if (user === correct) {
                document.getElementById('quizCard').classList.add('correct-flash');
                setTimeout(() => {
                    document.getElementById('quizCard').classList.remove('correct-flash');
                    if (idx + 1 < db.length) renderQuiz(idx + 1);
                    else { alert("🎉 你太棒了！全部完成！"); window.switchTab('list'); }
                }, 600);
            } else {
                alert(`喔喔！答案是：${db[idx].word}`);
                window.speak(db[idx].word);
            }
        };

        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US'; 
            u.rate = 0.8; // 語音速度 0.8 倍
            window.speechSynthesis.speak(u);
        };

        // --- 工具集 ---
        function toggleLoader(s) {
            document.getElementById('idleUI').classList.toggle('hidden', s);
            document.getElementById('loadingUI').classList.toggle('hidden', !s);
        }

        function compressImage(file, maxWidth) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        function startCooldown(duration) {
            const btn = document.getElementById('mainScanBtn');
            const txt = document.getElementById('btnText');
            const tip = document.getElementById('quotaTip');
            btn.classList.add('btn-disabled');
            tip.classList.remove('hidden');
            let sec = duration;
            const timer = setInterval(() => {
                txt.innerText = `冷卻中 (${sec--}s)`;
                if (sec < 0) {
                    clearInterval(timer);
                    btn.classList.remove('btn-disabled');
                    tip.classList.add('hidden');
                    txt.innerText = "開始 AI 辨識";
                }
            }, 1000);
        }

        window.switchTab = (name) => {
            document.getElementById('listPage').classList.toggle('hidden', name !== 'list');
            document.getElementById('quizPage').classList.toggle('hidden', name !== 'quiz');
            document.getElementById('aiSection').classList.toggle('hidden', name === 'quiz');
            const isList = name === 'list';
            document.getElementById('tabBtnList').className = isList ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
            document.getElementById('tabBtnQuiz').className = !isList ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
        };

        window.fullReset = () => { if(confirm("確定清空？")) { localStorage.clear(); location.reload(); } };
        window.toggleSettings = () => document.getElementById('settingsSection').classList.toggle('hidden');
        function checkCooldown() {
            const diff = Date.now() - lastRequestTime;
            if (diff < 40000) startCooldown(Math.ceil((40000 - diff) / 1000));
        }
    </script>
</body>
</html>
