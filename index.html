<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 核心診斷工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f9fafb; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6">

    <div class="max-w-md mx-auto space-y-6">
        <header class="text-center">
            <h1 class="text-xl font-black text-slate-800 tracking-tighter">Gemini OCR 核心對接</h1>
            <p class="text-[9px] text-slate-400">VERSION 2026.04.24-ULTRA_LEAN</p>
        </header>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
            <label class="block text-[10px] font-bold text-slate-400 mb-2 uppercase">Google API Key</label>
            <input type="password" id="apiKey" class="w-full p-3 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-sm" placeholder="AIza...">
            <button onclick="saveKey()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm">儲存金鑰</button>
        </div>

        <div id="scanArea" class="hidden space-y-4">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border-2 border-indigo-50 text-center">
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="processImage(event)">
                <button id="btn" onclick="document.getElementById('fileInput').click()" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto flex items-center justify-center shadow-lg active:scale-90 transition-all">
                    <i class="fas fa-camera text-3xl"></i>
                </button>
                <h2 class="mt-4 font-bold text-slate-700">點擊拍照辨識</h2>
                <p id="statusTxt" class="text-[10px] text-slate-400 mt-2">支援自動縮圖防爆功能</p>
            </div>

            <div class="bg-slate-900 rounded-2xl p-4 h-64 overflow-y-auto font-mono text-[10px] text-green-400" id="log">
                [SYSTEM] 等待任務開始...
            </div>
        </div>
    </div>

    <script>
        const log = (msg, isErr = false) => {
            const div = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = isErr ? 'text-red-400' : 'text-green-400';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(entry);
            div.scrollTop = div.scrollHeight;
        };

        window.onload = () => {
            if(localStorage.getItem('study_key')) {
                document.getElementById('apiKey').value = localStorage.getItem('study_key');
                document.getElementById('scanArea').classList.remove('hidden');
            }
        };

        function saveKey() {
            const key = document.getElementById('apiKey').value.trim();
            if(!key.startsWith("AIza")) return alert("格式錯誤！");
            localStorage.setItem('study_key', key);
            document.getElementById('scanArea').classList.remove('hidden');
            log("API Key 已更新，系統就緒。");
        }

        async function processImage(e) {
            const file = e.target.files[0];
            if(!file) return;

            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            log("正在處理圖片：使用極限縮圖策略...");

            try {
                // 1. 強制縮圖到 800px 寬度 (降低 Token 流量，避開 429)
                const base64 = await compressImage(file, 800);
                log("圖片已微縮，正在連線 Google 伺服器...");

                const key = localStorage.getItem('study_key');
                // 2. 使用 v1beta 路由，這是 2026 年最具彈性的介面
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "只辨識這張英文考卷中的英文單字與中文翻譯，格式：英文 | 中文" },
                                   { inline_data: { mime_type: "image/jpeg", data: base64.split(',')[1] } }]
                        }]
                    })
                });

                const data = await response.json();

                if(data.error) {
                    throw new Error(data.error.message);
                }

                const result = data.candidates[0].content.parts[0].text;
                log("--- 辨識結果 ---");
                log(result);
                alert("辨識成功！請看下方日誌。");

            } catch (err) {
                log("!! 錯誤：" + err.message, true);
                if(err.message.includes("429")) log("提示：請等待 60 秒後再試，Google 正在冷卻你的 Key。", true);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                e.target.value = '';
            }
        }

        function compressImage(file, maxWidth) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }
    </script>
</body>
</html>
