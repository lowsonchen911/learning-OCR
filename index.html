<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 英文聽考系統 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .correct-flash { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; }
        .nav-btn { transition: all 0.2s; }
        .nav-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="pb-24">

    <header class="bg-indigo-700 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center"><i class="fas fa-headset mr-2 text-yellow-300"></i>AI 聽考系統</h1>
                <p id="versionTag" class="text-[9px] text-indigo-300 font-bold tracking-widest uppercase">Version: 2026.04.24-Pro-Max</p>
            </div>
            <button onclick="window.toggleSettings()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20">
                <i class="fas fa-cog text-xl text-yellow-300"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <section id="settingsSection" class="hidden mb-6 bg-slate-800 text-white rounded-3xl p-6 shadow-2xl">
            <h3 class="font-bold mb-4">系統管理</h3>
            <input type="password" id="apiKeyInput" placeholder="在此貼入 API Key" class="w-full bg-slate-700 border-none rounded-xl p-4 text-sm mb-4 outline-none text-white focus:ring-2 focus:ring-indigo-500">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="window.saveSettings()" class="col-span-2 bg-yellow-500 text-slate-900 py-3 rounded-xl font-bold">儲存設定</button>
                <button onclick="window.exportData()" class="bg-slate-700 py-2 rounded-xl text-xs">導出題庫</button>
                <button onclick="window.fullReset()" class="bg-red-500/20 text-red-400 py-2 rounded-xl text-xs">清除全部</button>
            </div>
        </section>

        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-200">
                <div id="idleUI">
                    <div class="flex gap-2 mb-4">
                        <select id="gradeSelect" class="flex-1 bg-indigo-50 text-indigo-700 font-bold py-3 px-4 rounded-xl outline-none">
                            <option value="G1">一年級</option><option value="G2">二年級</option>
                            <option value="G3" selected>三年級</option><option value="G4">四年級</option>
                            <option value="G5">五年級</option><option value="G6">六年級</option>
                        </select>
                    </div>
                    <div class="mb-4 flex gap-2">
                        <input type="text" id="manualInput" placeholder="手動加英文單字" class="flex-1 bg-slate-100 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-400">
                        <button onclick="window.handleManual()" class="bg-indigo-600 text-white px-5 rounded-xl font-bold"><i class="fas fa-plus"></i></button>
                    </div>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="window.handleAiUpload(event)">
                    <button onclick="window.checkBeforeUpload()" id="scanBtn" class="w-full bg-indigo-100 text-indigo-700 py-4 rounded-2xl font-bold active:scale-95 transition-all">
                        <i class="fas fa-camera mr-2"></i> 拍照自動加入題庫
                    </button>
                </div>
                <div id="loadingUI" class="hidden py-10 text-center">
                    <i class="fas fa-circle-notch spin text-4xl text-indigo-600 mb-4 inline-block"></i>
                    <p class="text-indigo-600 font-bold animate-pulse" id="loaderText">AI 處理中...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200/50 p-1.5 rounded-2xl mb-6 shadow-inner">
            <button onclick="window.switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600">題庫</button>
            <button onclick="window.startExam()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500">測驗</button>
            <button onclick="window.switchTab('history')" id="tabBtnHistory" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500">紀錄</button>
        </div>

        <section id="listPage"><div id="itemList" class="space-y-3"></div></section>
        <section id="historyPage" class="hidden"><div id="historyList" class="space-y-3"></div></section>
        
        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[3rem] shadow-2xl p-8 text-center min-h-[550px] flex flex-col justify-between border border-indigo-50 relative">
                </div>
        </section>

        <section id="resultPage" class="hidden">
            <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border border-slate-100">
                <div class="text-center mb-6">
                    <div id="resCode" class="text-[10px] text-slate-400 font-mono mb-2 uppercase font-bold tracking-widest">---</div>
                    <div id="scoreDisplay" class="text-7xl font-black text-indigo-600 mb-2">0</div>
                    <p class="font-bold text-slate-500 italic">聽考成果總結</p>
                </div>
                <div id="resultSummary" class="space-y-2 max-h-80 overflow-y-auto px-2"></div>
                <button onclick="window.switchTab('list')" class="w-full mt-8 bg-indigo-700 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95">確認並關閉</button>
            </div>
        </section>
    </main>

    <script type="module">
        let db = JSON.parse(localStorage.getItem('exam_db_max')) || [];
        let history = JSON.parse(localStorage.getItem('history_max')) || [];
        let activeModel = "";
        let currentExam = [];
        let currentIdx = 0;
        let examAnswers = []; // 用來存使用者輸入的答案，方便前後切換

        window.onload = async () => {
            const k = localStorage.getItem('userKey_vFinal');
            if (k) { document.getElementById('apiKeyInput').value = k; await detectModel(k); }
            else window.toggleSettings(true);
            updateUI();
        };

        async function detectModel(key) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const d = await r.json();
                const m = d.models.find(i => i.name.includes('1.5-flash')) || d.models[0];
                activeModel = m.name;
            } catch(e) {}
        }

        window.saveSettings = () => {
            localStorage.setItem('userKey_vFinal', document.getElementById('apiKeyInput').value.trim());
            location.reload();
        };

        window.handleManual = async () => {
            const input = document.getElementById('manualInput');
            const word = input.value.trim();
            if(!word) return;
            const grade = document.getElementById('gradeSelect').value;
            toggleLoader(true, "AI 正在理解單字...");
            try {
                const key = localStorage.getItem('userKey_vFinal');
                const aiRes = await callGemini(`針對${grade}程度，翻譯「${word}」並造簡單英文句。格式：單字 | 翻譯 | 例句`, key);
                processData(aiRes, grade);
                input.value = "";
            } catch (e) { alert("失敗"); }
            finally { toggleLoader(false); }
        };

        window.checkBeforeUpload = () => { if(!activeModel) return window.toggleSettings(true); document.getElementById('cameraInput').click(); };

        window.handleAiUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            toggleLoader(true, "AI 掃描題庫中...");
            const grade = document.getElementById('gradeSelect').value;
            try {
                const base64 = await compressImage(file);
                const key = localStorage.getItem('userKey_vFinal');
                const aiRes = await callGemini(`辨識圖片單字。任務：過濾雜訊，為${grade}造英文例句。格式：單字 | 翻譯 | 例句。`, key, base64);
                processData(aiRes, grade);
            } catch (err) { alert("辨識失敗"); }
            finally { toggleLoader(false); e.target.value = ''; }
        };

        async function callGemini(p, key, b64 = null) {
            const url = `https://generativelanguage.googleapis.com/v1beta/${activeModel}:generateContent?key=${key}`;
            const parts = [{ text: p }];
            if(b64) parts.push({ inline_data: { mime_type: "image/jpeg", data: b64.split(',')[1] } });
            const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) });
            const data = await resp.json();
            return data.candidates[0].content.parts[0].text;
        }

        function processData(text, grade) {
            text.split('\n').forEach(line => {
                if (line.includes('|')) {
                    let p = line.split('|').map(s => s.trim());
                    if (p.length >= 3) {
                        let word = p[0].replace(/[^a-zA-Z]/g, '');
                        if (word.length > 1) db.push({ id: Date.now()+Math.random(), word, trans: p[1], sentence: p[2], grade });
                    }
                }
            });
            localStorage.setItem('exam_db_max', JSON.stringify(db));
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('itemList');
            list.innerHTML = db.slice().reverse().map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                    <div onclick="window.speak('${item.word}')" class="flex-1 cursor-pointer">
                        <div class="font-bold text-indigo-900">${item.word} <span class="text-[9px] bg-slate-100 px-2 py-1 rounded ml-2">${item.grade}</span></div>
                        <div class="text-[10px] text-slate-400">${item.trans}</div>
                    </div>
                    <button onclick="window.deleteItem(${item.id})" class="text-slate-200 p-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');

            document.getElementById('historyList').innerHTML = history.slice().reverse().map(h => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100 mb-2">
                    <div><div class="font-mono text-[9px] text-indigo-400 font-bold">${h.code}</div><div class="font-black text-indigo-900">${h.score} 分</div></div>
                    <div class="text-[9px] text-slate-300 font-medium">${h.date}</div>
                </div>
            `).join('');
        }

        window.deleteItem = (id) => { if(confirm("刪除？")) { db = db.filter(i => i.id !== id); localStorage.setItem('exam_db_max', JSON.stringify(db)); updateUI(); } };

        // --- 聽考系統核心 (5-5-10 & 導航) ---
        window.startExam = () => {
            if (db.length < 5) return alert("題庫單字量不足（至少需 5 個）。");
            let shuffled = [...db].sort(() => 0.5 - Math.random());
            currentExam = [];
            for(let i=0; i<20; i++) currentExam.push(shuffled[i % shuffled.length]);
            
            examAnswers = new Array(20).fill(""); // 初始化空答案
            currentIdx = 0;
            window.switchTab('quiz');
            renderQuestion();
        };

        function renderQuestion() {
            const item = currentExam[currentIdx];
            const card = document.getElementById('quizCard');
            const isVocab = currentIdx < 5;
            const isChoice = currentIdx >= 5 && currentIdx < 10;
            const isCloze = currentIdx >= 10;

            let mainContent = "";
            if (isVocab) {
                mainContent = `
                    <div class="flex-1 flex flex-col justify-center">
                        <button onclick="window.speak('${item.word}')" class="w-32 h-32 bg-indigo-600 text-white rounded-full mx-auto mb-8 shadow-2xl active:scale-95 transition-all">
                            <i class="fas fa-volume-up text-4xl"></i>
                        </button>
                        <div class="text-slate-300 text-xs font-bold uppercase tracking-widest">請聽考單字拼寫</div>
                    </div>`;
            } else if (isChoice) {
                const opts = generateOptions(item.word);
                mainContent = `
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="text-indigo-900 font-bold text-2xl mb-8 leading-relaxed">${item.sentence.replace(new RegExp(item.word,'gi'),'____')}</div>
                        <div class="grid grid-cols-1 gap-3 px-4">
                            ${opts.map(o => `<button onclick="window.submitAns('${o}')" class="bg-indigo-50 hover:bg-indigo-600 hover:text-white py-5 rounded-2xl font-black transition-all text-lg shadow-sm">${o}</button>`).join('')}
                        </div>
                    </div>`;
            } else {
                mainContent = `
                    <div class="flex-1 flex flex-col justify-center">
                        <button onclick="window.speak('${item.sentence}')" class="w-24 h-24 bg-slate-800 text-white rounded-full mx-auto mb-6 shadow-xl active:scale-95 transition-all">
                            <i class="fas fa-volume-up text-3xl"></i>
                        </button>
                        <div class="text-indigo-900 font-bold text-2xl leading-relaxed mb-6 px-4 font-serif">${item.sentence.replace(new RegExp(item.word,'gi'),'______')}</div>
                        <div class="text-slate-300 text-xs font-bold uppercase tracking-widest italic">聽取例句填入空格</div>
                    </div>`;
            }

            card.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-300 text-[10px] font-black tracking-[0.2em]">EXAM ${currentIdx + 1} / 20</span>
                    <button onclick="window.speak('${isVocab ? item.word : item.sentence}')" class="text-indigo-500 font-bold text-[10px] bg-indigo-50 px-3 py-1 rounded-full"><i class="fas fa-redo-alt mr-1"></i>重聽題目</button>
                </div>
                ${mainContent}
                <div class="${isChoice ? 'hidden' : 'mt-8'}">
                    <input type="text" id="ansIn" onkeydown="handleEnter(event)" value="${examAnswers[currentIdx]}" class="w-full border-b-4 border-indigo-100 text-3xl text-center p-2 mb-4 outline-none focus:border-indigo-500 uppercase font-black" placeholder="..." autocomplete="off">
                    <p class="text-[10px] text-slate-300 font-bold">ENTER 跳下一題</p>
                </div>
                <div class="flex justify-between mt-8">
                    <button onclick="window.prevQ()" class="nav-btn text-indigo-400 text-xs font-bold p-2 ${currentIdx === 0 ? 'invisible' : ''}"><i class="fas fa-chevron-left mr-1"></i>上一題</button>
                    ${currentIdx === 19 ? 
                        `<button onclick="window.finishExam()" class="bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg">交卷評分</button>` : 
                        `<button onclick="window.nextQ()" class="nav-btn text-indigo-400 text-xs font-bold p-2">下一題<i class="fas fa-chevron-right ml-1"></i></button>`}
                </div>
            `;
            
            if(!isChoice) setTimeout(() => document.getElementById('ansIn').focus(), 400);
            window.speak(isVocab ? item.word : item.sentence);
        }

        function generateOptions(correct) {
            let opts = [correct];
            let pool = db.filter(d => d.word.toLowerCase() !== correct.toLowerCase());
            while(opts.length < 4 && pool.length > 0) {
                let r = pool.splice(Math.floor(Math.random()*pool.length), 1)[0].word;
                if(!opts.includes(r)) opts.push(r);
            }
            while(opts.length < 4) opts.push("---");
            return opts.sort(() => 0.5 - Math.random());
        }

        window.handleEnter = (e) => { if(e.key === "Enter") { window.saveCurrentAns(); window.nextQ(); } };
        window.saveCurrentAns = () => { if(document.getElementById('ansIn')) examAnswers[currentIdx] = document.getElementById('ansIn').value.trim(); };
        window.submitAns = (val) => { examAnswers[currentIdx] = val; window.nextQ(); };

        window.prevQ = () => { if(currentIdx > 0) { window.saveCurrentAns(); currentIdx--; renderQuestion(); } };
        window.nextQ = () => { 
            window.saveCurrentAns();
            if(currentIdx < 19) { currentIdx++; renderQuestion(); } 
            else { window.finishExam(); }
        };

        window.finishExam = () => {
            window.saveCurrentAns();
            let correctCount = 0;
            const summary = currentExam.map((q, i) => {
                const isCorrect = examAnswers[i].toLowerCase() === q.word.toLowerCase();
                if(isCorrect) correctCount++;
                return { word: q.word, user: examAnswers[i], isCorrect };
            });

            const score = Math.round((correctCount / 20) * 100);
            const grade = document.getElementById('gradeSelect').value;
            const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
            const code = `${grade}_${date}_${String(history.length+1).padStart(2,'0')}`;
            
            history.push({ code, score, date: new Date().toLocaleString(), results: summary });
            localStorage.setItem('history_max', JSON.stringify(history));

            document.getElementById('resCode').innerText = "EXAM CODE: " + code;
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('resultSummary').innerHTML = summary.map((s, i) => `
                <div class="flex items-center justify-between p-3 text-xs rounded-2xl ${s.isCorrect ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'} border border-slate-100 font-bold mb-1">
                    <span>${i+1}. ${s.word}</span>
                    <span>${s.isCorrect ? '✓' : (s.user || '空')}</span>
                </div>
            `).join('');
            window.switchTab('result');
            updateUI();
        };

        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US'; u.rate = 0.6; // 0.6 倍速
            window.speechSynthesis.speak(u);
        };

        // --- 工具 ---
        function toggleLoader(s, t="") {
            document.getElementById('idleUI').classList.toggle('hidden', s);
            document.getElementById('loadingUI').classList.toggle('hidden', !s);
            if(t) document.getElementById('loaderText').innerText = t;
        }

        function compressImage(file) {
            return new Promise(r => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 800; canvas.height = img.height * (800/img.width);
                        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                        r(canvas.toDataURL('image/jpeg',0.6));
                    };
                };
            });
        }

        window.switchTab = (name) => {
            ['listPage','historyPage','quizPage','resultPage','aiSection'].forEach(p => document.getElementById(p).classList.add('hidden'));
            if(name === 'list') { document.getElementById('listPage').classList.remove('hidden'); document.getElementById('aiSection').classList.remove('hidden'); }
            else if(name === 'history') document.getElementById('historyPage').classList.remove('hidden');
            else if(name === 'quiz') document.getElementById('quizPage').classList.remove('hidden');
            else if(name === 'result') document.getElementById('resultPage').classList.remove('hidden');
            
            const tabs = ['tabBtnList','tabBtnQuiz','tabBtnHistory'];
            tabs.forEach(t => document.getElementById(t).className = "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500 transition-all");
            const activeTab = name==='list'?'tabBtnList':(name==='quiz'?'tabBtnQuiz':'tabBtnHistory');
            if(document.getElementById(activeTab)) document.getElementById(activeTab).className = "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600 transition-all";
        };

        window.fullReset = () => { if(confirm("清空？")) { localStorage.clear(); location.reload(); } };
        window.toggleSettings = () => document.getElementById('settingsSection').classList.toggle('hidden');
        window.exportData = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'}));
            a.download = `exam_db.json`; a.click();
        };
    </script>
</body>
</html>
