<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 聽考 PRO - 極速版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .correct-flash { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
        input { text-transform: lowercase !important; }
        .option-btn { transition: all 0.1s; text-align: left; }
        .option-btn:active { background: #4f46e5 !important; color: white !important; }
    </style>
</head>
<body class="pb-24">

    <header class="bg-indigo-700 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center"><i class="fas fa-bolt mr-2 text-yellow-300"></i>聽考 PRO</h1>
                <p id="versionTag" class="text-[9px] text-indigo-200 font-bold tracking-widest uppercase">Version: 2026.04.24-Turbo-V2</p>
            </div>
            <button onclick="window.toggleSettings()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full active:scale-90"><i class="fas fa-cog text-xl text-yellow-300"></i></button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <section id="settingsSection" class="hidden mb-6 bg-slate-800 text-white rounded-3xl p-6 shadow-2xl">
            <h3 class="font-bold mb-4">系統設定</h3>
            <input type="password" id="apiKeyInput" placeholder="在此輸入 API Key" class="w-full bg-slate-700 border-none rounded-xl p-4 text-sm mb-4 outline-none text-white focus:ring-2 focus:ring-indigo-500">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="window.saveSettings()" class="col-span-2 bg-indigo-500 py-3 rounded-xl font-bold active:scale-95">儲存並重整</button>
                <button onclick="window.exportData()" class="bg-slate-700 py-2 rounded-xl text-xs">匯出題庫</button>
                <button onclick="window.fullReset()" class="bg-red-500/20 text-red-400 py-2 rounded-xl text-xs">清空數據</button>
            </div>
        </section>

        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-200">
                <div id="idleUI">
                    <div class="flex gap-2 mb-4">
                        <select id="gradeSelect" class="flex-1 bg-indigo-50 text-indigo-700 font-bold py-3 px-4 rounded-xl outline-none border border-indigo-100">
                            <option value="G1">一年級</option><option value="G2">二年級</option>
                            <option value="G3" selected>三年級</option><option value="G4">四年級</option>
                            <option value="G5">五年級</option><option value="G6">六年級</option>
                        </select>
                        <div id="modelBadge" class="bg-slate-100 text-slate-400 text-[9px] flex items-center px-3 rounded-xl font-bold uppercase">Ready</div>
                    </div>
                    
                    <div class="mb-4 flex gap-2">
                        <input type="text" id="manualInput" placeholder="手動加入單字" class="flex-1 bg-slate-100 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-400">
                        <button onclick="window.handleManual()" class="bg-indigo-600 text-white px-5 rounded-xl font-bold active:scale-90"><i class="fas fa-plus"></i></button>
                    </div>

                    <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="window.handleAiUpload(event)">
                    <button onclick="window.checkBeforeUpload()" id="scanBtn" class="w-full bg-indigo-100 text-indigo-700 py-4 rounded-2xl font-bold active:scale-95 transition-all">
                        <i class="fas fa-camera mr-2"></i> 拍照極速辨識 (自動去重)
                    </button>
                </div>
                <div id="loadingUI" class="hidden py-10 text-center">
                    <i class="fas fa-circle-notch spin text-4xl text-indigo-600 mb-4 inline-block"></i>
                    <p class="text-indigo-600 font-bold animate-pulse">處理中，請稍候...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200/50 p-1.5 rounded-2xl mb-6 shadow-inner">
            <button onclick="window.switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600 transition-all">我的題庫</button>
            <button onclick="window.startExam()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500 transition-all">聽考測驗</button>
            <button onclick="window.switchTab('history')" id="tabBtnHistory" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500 transition-all">歷史紀錄</button>
        </div>

        <section id="listPage"><div id="itemList" class="space-y-3"></div></section>
        <section id="historyPage" class="hidden"><div id="historyList" class="space-y-3"></div></section>
        <section id="quizPage" class="hidden"><div id="quizCard" class="bg-white rounded-[3rem] shadow-2xl p-8 text-center min-h-[580px] flex flex-col justify-between border border-indigo-50 relative"></div></section>

        <section id="resultPage" class="hidden">
            <div class="bg-white rounded-[2.5rem] shadow-xl p-6 border border-slate-100">
                <div class="text-center mb-6">
                    <div id="resCode" class="text-[10px] text-slate-400 font-mono mb-2 font-bold tracking-widest uppercase">---</div>
                    <div id="scoreDisplay" class="text-7xl font-black text-indigo-600 mb-2">100</div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest italic">Exam Performance Report</p>
                </div>
                <div id="resultSummary" class="space-y-3 max-h-[420px] overflow-y-auto px-1"></div>
                <button onclick="window.switchTab('list')" class="w-full mt-6 bg-indigo-700 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">確認並返回</button>
            </div>
        </section>
    </main>

    <script type="module">
        let db = JSON.parse(localStorage.getItem('v2_turbo_db')) || [];
        let history = JSON.parse(localStorage.getItem('v2_turbo_history')) || [];
        let activeModel = "";
        let currentExamItems = [];
        let currentIdx = 0;
        let examUserAnswers = []; 
        let examOptionsState = []; 

        window.onload = async () => {
            const key = localStorage.getItem('v2_turbo_key');
            if (key) { document.getElementById('apiKeyInput').value = key; await detectModel(key); }
            else window.toggleSettings(true);
            updateUI();
        };

        async function detectModel(key) {
            try {
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const d = await r.json();
                const m = d.models.find(i => i.name.includes('1.5-flash')) || d.models[0];
                activeModel = m.name;
                document.getElementById('modelBadge').innerText = m.displayName;
            } catch(e) {}
        }

        window.saveSettings = () => { localStorage.setItem('v2_turbo_key', document.getElementById('apiKeyInput').value.trim()); location.reload(); };

        // --- 優化核心：極速去重與處理 ---
        function processRawData(text, grade) {
            let addedCount = 0;
            // 使用 Map 進行 O(1) 搜尋，大幅提升比對速度
            const dbMap = new Map(db.map(item => [item.word.toLowerCase(), true]));
            
            text.split('\n').forEach(line => {
                if (line.includes('|')) {
                    let parts = line.split('|').map(s => s.trim());
                    if (parts.length >= 3) {
                        let word = parts[0].replace(/[^a-zA-Z]/g, '').toLowerCase();
                        if (word.length > 1 && !dbMap.has(word)) {
                            db.push({ id: Date.now() + Math.random(), word, trans: parts[1], sentence: parts[2], grade });
                            dbMap.set(word, true); // 防範單次辨識中出現多個重複單字
                            addedCount++;
                        }
                    }
                }
            });
            localStorage.setItem('v2_turbo_db', JSON.stringify(db));
            updateUI();
            return addedCount;
        }

        window.handleManual = async () => {
            const input = document.getElementById('manualInput');
            const word = input.value.trim().toLowerCase();
            if(!word) return;
            // 預先過濾，節送 API 請求
            if(db.some(i => i.word.toLowerCase() === word)) { alert("題庫已存在。"); return; }

            toggleLoader(true, "AI 翻譯中...");
            try {
                const key = localStorage.getItem('v2_turbo_key');
                // 精簡 Prompt 加速 AI 回應
                const aiRes = await callGemini(`Translate "${word}" and make a simple sentence for Grade 3. Format: Word | Trans | Sentence`, key);
                processRawData(aiRes, gradeSelect.value);
                input.value = "";
            } catch (e) { alert("連線失敗，可能是 API 頻率限制。"); }
            finally { toggleLoader(false); }
        };

        window.checkBeforeUpload = () => { if(!activeModel) return window.toggleSettings(true); document.getElementById('cameraInput').click(); };

        window.handleAiUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            toggleLoader(true, "AI 高速辨識中...");
            try {
                const base64 = await compressImage(file);
                const key = localStorage.getItem('v2_turbo_key');
                // 極簡 Prompt 節省 AI 處理負載
                const prompt = `OCR English words. No noise. Format: Word | Trans | Sentence.`;
                const aiRes = await callGemini(prompt, key, base64);
                const added = processRawData(aiRes, gradeSelect.value);
                alert(`處理完成！新增 ${added} 個單字。`);
            } catch (err) { alert("辨識超時或失敗。"); }
            finally { toggleLoader(false); e.target.value = ''; }
        };

        async function callGemini(p, key, b64 = null) {
            const url = `https://generativelanguage.googleapis.com/v1beta/${activeModel}:generateContent?key=${key}`;
            const parts = [{ text: p }];
            if(b64) parts.push({ inline_data: { mime_type: "image/jpeg", data: b64.split(',')[1] } });
            const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts }] }) });
            const data = await resp.json();
            if (data.error) throw new Error(data.error.message);
            return data.candidates[0].content.parts[0].text;
        }

        function updateUI() {
            document.getElementById('itemList').innerHTML = db.slice().reverse().map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                    <div onclick="window.speak('${item.word}')" class="flex-1 cursor-pointer">
                        <div class="font-bold text-indigo-900">${item.word} <span class="text-[9px] bg-indigo-50 text-indigo-400 px-2 py-1 rounded ml-2">${item.grade}</span></div>
                        <div class="text-[10px] text-slate-400">${item.trans}</div>
                    </div>
                    <button onclick="window.deleteItem(${item.id})" class="text-slate-200 p-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');

            document.getElementById('historyList').innerHTML = history.slice().reverse().map(h => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100 mb-2">
                    <div><div class="font-mono text-[9px] text-indigo-400 font-bold">${h.code}</div><div class="font-black text-indigo-900">${h.score} 分</div></div>
                    <div class="text-[9px] text-slate-300">${h.date}</div>
                </div>
            `).join('');
        }

        window.deleteItem = (id) => { if(confirm("刪除？")) { db = db.filter(i => i.id !== id); localStorage.setItem('v2_turbo_db', JSON.stringify(db)); updateUI(); } };

        // --- 聽考邏輯 ---
        window.startExam = () => {
            if (db.length < 5) return alert("題庫不足。");
            let shuffled = [...db].sort(() => 0.5 - Math.random());
            currentExamItems = [];
            for(let i=0; i<20; i++) currentExamItems.push(shuffled[i % shuffled.length]);
            examUserAnswers = new Array(20).fill("");
            examOptionsState = new Array(20).fill(null);
            currentIdx = 0;
            window.switchTab('quiz');
            renderExamCard();
        };

        function renderExamCard() {
            const item = currentExamItems[currentIdx];
            const card = document.getElementById('quizCard');
            const isVocab = currentIdx < 5;
            const isChoice = currentIdx >= 5 && currentIdx < 10;

            let bodyHtml = "";
            if (isVocab) {
                bodyHtml = `<div class="flex-1 flex flex-col justify-center">
                    <button onclick="window.speak('${item.word}')" class="w-32 h-32 bg-indigo-600 text-white rounded-full mx-auto mb-8 shadow-2xl active:scale-95"><i class="fas fa-volume-up text-4xl"></i></button>
                    <div class="text-slate-300 text-xs font-bold uppercase italic">Listen and Spell the Word</div>
                </div>`;
            } else if (isChoice) {
                if (!examOptionsState[currentIdx]) { examOptionsState[currentIdx] = generateOptionsList(item.word); }
                const opts = examOptionsState[currentIdx];
                bodyHtml = `<div class="flex-1 flex flex-col justify-center px-4">
                    <div class="text-indigo-900 font-bold text-2xl mb-10 leading-relaxed">${item.sentence.replace(new RegExp(item.word,'gi'),'____')}</div>
                    <div class="grid grid-cols-1 gap-3">
                        ${opts.map((o, i) => {
                            const isSelected = examUserAnswers[currentIdx] === o.toLowerCase();
                            return `<button onclick="window.handleChoice('${o}')" class="option-btn ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-50'} py-5 rounded-2xl font-black text-lg shadow-sm px-6">
                                <span class="${isSelected ? 'text-indigo-200' : 'text-indigo-400'} mr-2">${i+1}.</span> ${o}
                            </button>`;
                        }).join('')}
                    </div>
                </div>`;
            } else {
                bodyHtml = `<div class="flex-1 flex flex-col justify-center">
                    <button onclick="window.speak('${item.sentence}')" class="w-24 h-24 bg-slate-800 text-white rounded-full mx-auto mb-6 shadow-xl active:scale-95"><i class="fas fa-volume-up text-3xl"></i></button>
                    <div class="text-indigo-900 font-bold text-2xl leading-relaxed mb-6 px-4 font-serif">${item.sentence.replace(new RegExp(item.word,'gi'),'______')}</div>
                    <div class="text-slate-300 text-xs font-bold italic uppercase tracking-tighter">Listening and Fill (No Hint)</div>
                </div>`;
            }

            card.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <span class="text-slate-300 text-[10px] font-black tracking-[0.2em]">EXAM ${currentIdx + 1} / 20</span>
                    <button onclick="window.speak('${isVocab ? item.word : item.sentence}')" class="text-indigo-500 font-bold text-[10px] bg-indigo-50 px-4 py-2 rounded-full active:scale-90"><i class="fas fa-redo-alt mr-1"></i>重聽題目</button>
                </div>
                ${bodyHtml}
                <div class="${isChoice ? 'hidden' : 'mt-8'}">
                    <input type="text" id="examInput" onkeydown="handleEnter(event)" value="${examUserAnswers[currentIdx]}" class="w-full border-b-4 border-indigo-100 text-4xl text-center p-2 mb-4 outline-none focus:border-indigo-500 font-black" placeholder="..." autocomplete="off">
                </div>
                <div class="flex justify-between mt-8 pt-4 border-t border-slate-50">
                    <button onclick="window.movePrev()" class="text-indigo-400 text-xs font-bold p-2 ${currentIdx === 0 ? 'invisible' : ''}"><i class="fas fa-chevron-left mr-1"></i>上一題</button>
                    ${currentIdx === 19 ? `<button onclick="window.finalizeExam()" class="bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg active:scale-95">提交評分</button>` 
                    : `<button onclick="window.moveNext()" class="text-indigo-400 text-xs font-bold p-2">下一題<i class="fas fa-chevron-right ml-1"></i></button>`}
                </div>
            `;
            if(!isChoice) setTimeout(() => document.getElementById('examInput').focus(), 400);
            window.speak(isVocab ? item.word : item.sentence);
        }

        function generateOptionsList(correct) {
            let o = [correct]; let p = db.filter(d => d.word.toLowerCase() !== correct.toLowerCase());
            while(o.length < 4 && p.length > 0) { let r = p.splice(Math.floor(Math.random()*p.length), 1)[0].word; if(!o.includes(r)) o.push(r); }
            while(o.length < 4) o.push("---");
            return o.sort(() => 0.5 - Math.random());
        }

        window.handleEnter = (e) => { if(e.key === "Enter") { window.saveCurAns(); window.moveNext(); } };
        window.handleChoice = (val) => { examUserAnswers[currentIdx] = val.toLowerCase(); setTimeout(window.moveNext, 150); };
        window.saveCurAns = () => { const i = document.getElementById('examInput'); if(i) examUserAnswers[currentIdx] = i.value.trim().toLowerCase(); };
        window.movePrev = () => { window.saveCurAns(); if(currentIdx > 0) { currentIdx--; renderExamCard(); } };
        window.moveNext = () => { window.saveCurAns(); if(currentIdx < 19) { currentIdx++; renderExamCard(); } else { window.finalizeExam(); } };

        window.finalizeExam = () => {
            window.saveCurAns(); let score = 0;
            const summaryData = currentExamItems.map((q, i) => {
                const correctWord = q.word.toLowerCase(); const userAns = examUserAnswers[i];
                const isCorrect = userAns === correctWord; if(isCorrect) score += 5;
                
                let dc = correctWord, du = userAns || "(未填)";
                if (i >= 5 && i < 10) {
                    const opts = examOptionsState[i];
                    const ci = opts.findIndex(o => o.toLowerCase() === correctWord) + 1;
                    const ui = opts.findIndex(o => o.toLowerCase() === userAns) + 1;
                    dc = `(${ci}) ${correctWord}`; du = ui > 0 ? `(${ui}) ${userAns}` : userAns;
                }
                return { type: i<5?'單字':(i<10?'選擇':'填空'), word: dc, user: du, isCorrect };
            });

            const code = `${gradeSelect.value}_${new Date().toISOString().slice(0,10).replace(/-/g,'')}_${String(history.length+1).padStart(2,'0')}`;
            history.push({ code, score, date: new Date().toLocaleString(), results: summaryData });
            localStorage.setItem('v2_turbo_history', JSON.stringify(history));

            document.getElementById('resCode').innerText = "EXAM: " + code;
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('resultSummary').innerHTML = summaryData.map((s, i) => `
                <div class="bg-white p-4 rounded-2xl border ${s.isCorrect ? 'border-green-100 bg-green-50/30' : 'border-red-100 bg-red-50/30'} flex flex-col gap-1 mb-2">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-tighter">${i+1}. ${s.type}題</span>
                        <i class="fas ${s.isCorrect ? 'fa-check-circle text-green-500' : 'fa-times-circle text-red-500'}"></i>
                    </div>
                    <div class="flex flex-col text-xs">
                        <div class="flex justify-between"><span class="text-slate-400 font-bold">正確答案</span><span class="text-indigo-700 font-black">${s.word}</span></div>
                        <div class="flex justify-between border-t border-slate-100 pt-1 mt-1"><span class="text-slate-400 font-bold">你的答案</span><span class="${s.isCorrect?'text-green-600':'text-red-600'} font-black">${s.user}</span></div>
                    </div>
                </div>
            `).join('');
            window.switchTab('result'); updateUI();
        };

        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US'; u.rate = 0.6; // 語速 0.6x
            window.speechSynthesis.speak(u);
        };

        function toggleLoader(s, t="") {
            document.getElementById('idleUI').classList.toggle('hidden', s);
            document.getElementById('loadingUI').classList.toggle('hidden', !s);
            if(t) document.querySelector('#loadingUI p').innerText = t;
        }

        function compressImage(file) {
            return new Promise(r => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 800; canvas.height = img.height * (800/img.width);
                        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                        r(canvas.toDataURL('image/jpeg',0.6));
                    };
                };
            });
        }

        window.switchTab = (name) => {
            ['listPage','historyPage','quizPage','resultPage','aiSection'].forEach(p => document.getElementById(p).classList.add('hidden'));
            if(name === 'list') { document.getElementById('listPage').classList.remove('hidden'); document.getElementById('aiSection').classList.remove('hidden'); }
            else if(name === 'history') document.getElementById('historyPage').classList.remove('hidden');
            else if(name === 'quiz') document.getElementById('quizPage').classList.remove('hidden');
            else if(name === 'result') document.getElementById('resultPage').classList.remove('hidden');
            const tabs = ['tabBtnList','tabBtnQuiz','tabBtnHistory'];
            tabs.forEach(t => document.getElementById(t).className = "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500 transition-all");
            const activeTab = name==='list'?'tabBtnList':(name==='quiz'?'tabBtnQuiz':'tabBtnHistory');
            if(document.getElementById(activeTab)) document.getElementById(activeTab).className = "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600";
        };

        window.fullReset = () => { if(confirm("確定清除？")) { localStorage.clear(); location.reload(); } };
        window.toggleSettings = () => document.getElementById('settingsSection').classList.toggle('hidden');
        window.exportData = () => {
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'}));
            a.download = `exam_db.json`; a.click();
        };
    </script>
</body>
</html>
