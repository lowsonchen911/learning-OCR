<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini API 診斷工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-xl font-bold mb-4">Gemini API 核心診斷</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-bold mb-2">1. 輸入 API Key</label>
            <input type="password" id="keyIn" class="w-full border p-3 rounded" placeholder="AIza...">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-bold mb-2">2. 選擇測試模型 (2026 建議清單)</label>
            <select id="modelSelect" class="w-full border p-3 rounded bg-gray-50">
                <option value="gemini-1.5-flash">gemini-1.5-flash (標準版)</option>
                <option value="gemini-1.5-flash-latest">gemini-1.5-flash-latest (最新預覽)</option>
                <option value="gemini-2.0-flash">gemini-2.0-flash (2026 高速版)</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro (最強但最慢)</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-bold mb-2">3. 選擇一張照片</label>
            <input type="file" id="fileIn" accept="image/*" class="w-full">
        </div>

        <button onclick="runTest()" id="runBtn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95">
            執行核心診斷
        </button>

        <div class="mt-8">
            <h2 class="font-bold text-gray-500 mb-2">診斷日誌：</h2>
            <div id="log" class="bg-black text-green-400 p-4 rounded text-xs h-64 overflow-y-auto font-mono">
                等待開始...
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        function log(msg, color = "text-green-400") {
            const div = document.getElementById('log');
            const span = document.createElement('div');
            span.className = color;
            span.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            div.appendChild(span);
            div.scrollTop = div.scrollHeight;
        }

        window.runTest = async () => {
            const key = document.getElementById('keyIn').value.trim();
            const modelId = document.getElementById('modelSelect').value;
            const file = document.getElementById('fileIn').files[0];

            if (!key || !file) return alert("請填寫 Key 並選擇照片！");

            document.getElementById('runBtn').disabled = true;
            document.getElementById('log').innerHTML = "";
            log(`啟動診斷，使用模型: ${modelId}...`);

            try {
                // 1. 初始化 SDK
                const genAI = new GoogleGenerativeAI(key);
                
                // 2. 獲取模型
                log("正在初始化 GenerativeModel...");
                const model = genAI.getGenerativeModel({ model: modelId });

                // 3. 讀取圖片
                log("正在讀取圖片檔案...");
                const base64Data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                });
                log("圖片讀取成功。");

                // 4. 發送請求
                log("正在連線 Google AI 伺服器 (這可能需要 5-10 秒)...");
                const result = await model.generateContent([
                    "Identify only the text in this image.",
                    { inlineData: { data: base64Data, mimeType: file.type } }
                ]);

                // 5. 輸出結果
                log("--- [ 成功獲得回應 ] ---", "text-yellow-400");
                const response = await result.response;
                const text = response.text();
                log("回應內容：\n" + text, "text-white");

            } catch (err) {
                log("--- [ 發生錯誤 ] ---", "text-red-500");
                log(`Error Name: ${err.name}`, "text-red-400");
                log(`Error Message: ${err.message}`, "text-red-400");
                
                // 深度解析 429 或是 404
                if (err.message.includes("429")) {
                    log("診斷結論：配額溢出 (429)。你的 Key 被 Google 暫時限制流量了。", "text-red-300");
                } else if (err.message.includes("404")) {
                    log("診斷結論：模型找不到 (404)。該模型 ID 可能不支援當前的 API 版本，或該 Key 無權使用此模型。", "text-red-300");
                } else if (err.message.includes("API key not valid")) {
                    log("診斷結論：金鑰無效。請重新確認 Key 字串是否正確。", "text-red-300");
                }
                
                console.error("Full Error Object:", err);
            } finally {
                document.getElementById('runBtn').disabled = false;
                log("測試結束。");
            }
        };
    </script>
</body>
</html>
