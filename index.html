<script type="module">
    // ==========================================
    // 核心設定：請在此貼上你的 Gemini API Key
    // ==========================================
    const API_KEY = "AIzaSyAG8ZRv5S2nddcjY1YlMp-llnWhdB1lb0Y"; 
    
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    let db = JSON.parse(localStorage.getItem('studyDB_vFinal')) || [];
    let currentQuizIdx = 0;

    // 初始化與事件監聽
    window.onload = () => { 
        updateUI(); 
        // 修正點：用 JavaScript 綁定事件，確保腳本載入完成才執行
        const cameraInput = document.getElementById('cameraInput');
        if (cameraInput) {
            cameraInput.addEventListener('change', startAiProcess);
        }
    };

    // 將函數掛載到 window，確保其他地方呼叫得到
    window.switchTab = switchTab;
    window.startQuiz = startQuiz;
    window.speak = speak;
    window.deleteItem = deleteItem;
    window.checkAnswer = checkAnswer;
    window.exportData = exportData;
    window.importData = importData;

    // --- AI 辨識流程 ---
    async function startAiProcess(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (API_KEY === "" || API_KEY.includes("YOUR")) return alert("請先填入 API Key！");

        toggleLoading(true);

        try {
            const base64Img = await toBase64(file);
            const genAI = new GoogleGenerativeAI(API_KEY);
            // 修正點：更新為最新的 Gemini 3 模型
            const model = genAI.getGenerativeModel({ model: "gemini-3-flash" });

            const prompt = `這是一張小三英文考卷。請辨識圖中所有的英文單字與句子，並執行：
            1. 自動修正 OCR 辨識錯誤。
            2. 確保拼字符合英語法。
            3. 將內容翻譯成繁體中文。
            請嚴格輸出格式為「單字/句子 | 繁體中文翻譯」，每行一個。`;

            const result = await model.generateContent([
                prompt,
                { inlineData: { data: base64Img.split(',')[1], mimeType: file.type } }
            ]);

            const response = result.response.text();
            processResponse(response);
            alert("AI 辨識成功！已加入題庫。");
        } catch (err) {
            console.error(err);
            alert("AI 辨識失敗：" + err.message);
        } finally {
            toggleLoading(false);
            e.target.value = '';
        }
    }

    // --- 剩餘邏輯保持不變 ---
    function processResponse(text) {
        const lines = text.split('\n');
        lines.forEach(line => {
            if (line.includes('|')) {
                let [word, trans] = line.split('|').map(s => s.trim());
                word = word.replace(/^[0-9]+[\.\s]*/, '').replace(/^\(\s*\)/, '');
                if (word && trans) {
                    db.push({ id: Date.now() + Math.random(), word, trans });
                }
            }
        });
        save();
    }

    function save() {
        localStorage.setItem('studyDB_vFinal', JSON.stringify(db));
        updateUI();
    }

    function updateUI() {
        const list = document.getElementById('itemList');
        const tip = document.getElementById('emptyTip');
        if (tip) tip.classList.toggle('hidden', db.length > 0);
        if (list) {
            list.innerHTML = db.map((item, idx) => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100 mb-2">
                    <div class="cursor-pointer" onclick="speak('${item.word}')">
                        <div class="font-bold text-indigo-900">${item.word}</div>
                        <div class="text-[10px] text-slate-400">${item.trans}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="speak('${item.word}')" class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center"><i class="fas fa-volume-up text-sm"></i></button>
                        <button onclick="deleteItem(${idx})" class="w-10 h-10 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center"><i class="fas fa-times text-sm"></i></button>
                    </div>
                </div>
            `).reverse().join('');
        }
    }

    function deleteItem(idx) {
        if(confirm("確定刪除嗎？")) {
            db.splice(db.length - 1 - idx, 1);
            save();
        }
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'en-US';
        ut.rate = 0.75;
        window.speechSynthesis.speak(ut);
    }

    function switchTab(name) {
        const listPage = document.getElementById('listPage');
        const quizPage = document.getElementById('quizPage');
        const aiSection = document.getElementById('aiSection');
        if(listPage) listPage.classList.toggle('hidden', name !== 'list');
        if(quizPage) quizPage.classList.toggle('hidden', name !== 'quiz');
        if(aiSection) aiSection.classList.toggle('hidden', name === 'quiz');
    }

    function startQuiz() {
        if (db.length === 0) return alert("題庫沒東西喔！");
        currentQuizIdx = 0;
        switchTab('quiz');
        renderQuiz();
    }

    function renderQuiz() {
        const item = db[currentQuizIdx];
        const card = document.getElementById('quizCard');
        if (card) {
            card.innerHTML = `
                <div class="text-slate-300 text-[10px] font-bold mb-6 uppercase tracking-widest">Progress ${currentQuizIdx + 1} / ${db.length}</div>
                <div class="mb-10">
                    <button onclick="speak('${item.word}')" class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-blue-600 text-white rounded-full shadow-2xl mb-4">
                        <i class="fas fa-volume-up text-3xl"></i>
                    </button>
                    <div class="text-indigo-400 font-bold text-lg mt-2">${item.trans}</div>
                </div>
                <input type="text" id="ansInput" class="w-full border-b-4 border-slate-100 focus:border-indigo-500 text-3xl text-center p-3 mb-10 outline-none uppercase font-bold" placeholder="..." autocomplete="off">
                <button onclick="checkAnswer()" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-bold text-xl shadow-xl">檢查答案</button>
            `;
            speak(item.word);
            setTimeout(() => {
                const input = document.getElementById('ansInput');
                if(input) input.focus();
            }, 400);
        }
    }

    function checkAnswer() {
        const input = document.getElementById('ansInput');
        if (!input) return;
        const user = input.value.trim().toLowerCase().replace(/[.?!,]/g, '');
        const correct = db[currentQuizIdx].word.trim().toLowerCase().replace(/[.?!,]/g, '');

        if (user === correct) {
            currentQuizIdx++;
            if (currentQuizIdx < db.length) renderQuiz();
            else { alert("🎉 全數練習完成！"); switchTab('list'); }
        } else {
            alert(`答案是：${db[currentQuizIdx].word}`);
            speak(db[currentQuizIdx].word);
        }
    }

    function toBase64(file) {
        return new Promise((r, j) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => r(reader.result);
            reader.onerror = e => j(e);
        });
    }

    function toggleLoading(show) {
        const idle = document.getElementById('idleUI');
        const loading = document.getElementById('loadingUI');
        if(idle) idle.classList.toggle('hidden', show);
        if(loading) loading.classList.toggle('hidden', !show);
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `study_data.json`;
        a.click();
    }

    function importData() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = event => {
                db = JSON.parse(event.target.result);
                save();
            };
            reader.readAsText(file);
        };
        input.click();
    }
</script>
