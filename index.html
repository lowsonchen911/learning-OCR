<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f0f4f8; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .btn-disabled { opacity: 0.4 !important; cursor: not-allowed !important; pointer-events: none; filter: grayscale(1); }
        .correct-flash { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
    </style>
</head>
<body class="pb-28">

    <header class="bg-indigo-800 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2.5rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center">
                    <i class="fas fa-magic mr-2 text-yellow-300"></i>AI 英文助手
                </h1>
                <p id="versionTag" class="text-[9px] text-indigo-200 font-bold uppercase tracking-widest">
                    Version: 2026.04.24-20 (Multi-Model Rescue)
                </p>
            </div>
            <button onclick="window.toggleSettings()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20">
                <i class="fas fa-cog text-xl text-yellow-300"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <section id="settingsSection" class="hidden mb-6 bg-slate-800 text-white rounded-[2rem] p-6 shadow-2xl">
            <h3 class="font-bold flex items-center text-indigo-300 mb-4"><i class="fas fa-tools mr-2"></i> 管理與診斷</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold">Google API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="在此輸入 AIza... 金鑰" class="w-full bg-slate-700 rounded-xl p-3 text-sm mt-1 outline-none text-white border border-slate-600">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="window.saveSettings()" class="col-span-2 bg-indigo-600 py-3 rounded-xl font-bold active:scale-95">儲存所有設定</button>
                    <button onclick="window.fullHardReset()" class="bg-red-500/20 text-red-400 py-2 rounded-xl text-[10px] border border-red-500/30">強制重置狀態</button>
                    <button onclick="window.exportData()" class="bg-slate-700 py-2 rounded-xl text-[10px] border border-slate-600">備份題庫</button>
                </div>
                <p class="text-[9px] text-slate-500 italic">註：若 2.0 報配額錯誤，程式會自動切換至 1.5 系列嘗試。</p>
            </div>
        </section>

        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-indigo-50 text-center">
                <div id="idleUI">
                    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-camera-retro text-3xl"></i>
                    </div>
                    <h2 class="font-bold text-slate-700 text-lg mb-6">辨識考卷內容</h2>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden">
                    <button id="mainScanBtn" onclick="window.checkBeforeUpload()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg transition-all active:scale-95">
                        <i class="fas fa-expand mr-2 text-yellow-300"></i> <span id="btnText">開始拍照</span>
                    </button>
                    <p id="quotaTip" class="text-[10px] text-red-500 mt-3 hidden italic font-bold">⚠️ API 忙碌中，請稍候...</p>
                </div>

                <div id="loadingUI" class="hidden py-10">
                    <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-600 mb-4"></i>
                    <p class="text-indigo-600 font-bold animate-pulse text-lg">AI 正在救災嘗試中...</p>
                    <p id="debugStatus" class="text-[10px] text-slate-400 mt-2 font-mono uppercase">Initializing...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200/50 p-1.5 rounded-2xl mb-6 shadow-inner">
            <button onclick="window.switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600 transition-all">目前題庫</button>
            <button onclick="window.startQuiz()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500 transition-all">測驗練習</button>
        </div>

        <section id="listPage">
            <div id="emptyTip" class="text-center py-20 text-slate-300 hidden font-bold">空空如也，拍張照吧！</div>
            <div id="itemList" class="space-y-3"></div>
        </section>

        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[3rem] shadow-2xl p-10 text-center min-h-[480px] flex flex-col justify-center border border-indigo-50"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white/80 backdrop-blur-xl border-t border-slate-100 flex justify-around p-5 shadow-lg z-40">
        <button onclick="window.switchTab('list')" class="flex flex-col items-center text-indigo-600"><i class="fas fa-th-large text-xl"></i><span class="text-[10px] mt-1 font-bold">管理</span></button>
        <button onclick="window.startQuiz()" class="flex flex-col items-center text-slate-300"><i class="fas fa-play text-xl"></i><span class="text-[10px] mt-1 font-bold">測驗</span></button>
    </nav>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        let db = JSON.parse(localStorage.getItem('studyDB_final')) || [];
        let lastRequestTimestamp = parseInt(localStorage.getItem('last_api_request_time')) || 0;

        // 救災模型名單：依序嘗試，避開 404 與 429
        const MODELS_TO_TRY = [
            "gemini-1.5-flash-latest",
            "gemini-1.5-flash",
            "gemini-1.5-flash-8b",
            "gemini-2.0-flash"
        ];

        window.toggleLoading = (s, status = "") => {
            document.getElementById('idleUI').classList.toggle('hidden', s);
            document.getElementById('loadingUI').classList.toggle('hidden', !s);
            if(status) document.getElementById('debugStatus').innerText = status;
        };

        const compressImage = (file, maxWidth) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = scale < 1 ? maxWidth : img.width;
                        canvas.height = scale < 1 ? img.height * scale : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); // 降低品質節省 Token
                    };
                };
            });
        };

        window.onload = () => {
            const savedKey = localStorage.getItem('user_gemini_key');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            else window.toggleSettings(true);
            
            updateUI();
            checkAndResumeCooldown();

            const camInput = document.getElementById('cameraInput');
            if (camInput) {
                camInput.onchange = null;
                camInput.addEventListener('change', window.handleAiUpload);
            }
        };

        window.fullHardReset = () => {
            localStorage.setItem('last_api_request_time', 0);
            location.reload();
        };

        function checkAndResumeCooldown() {
            const now = Date.now();
            const diff = now - lastRequestTimestamp;
            if (diff < 30000) startCooldown(Math.ceil((30000 - diff) / 1000));
        }

        window.toggleSettings = (show = null) => {
            const sec = document.getElementById('settingsSection');
            if (show === true) sec.classList.remove('hidden');
            else if (show === false) sec.classList.add('hidden');
            else sec.classList.toggle('hidden');
        };

        window.saveSettings = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('user_gemini_key', key);
            alert("金鑰已儲存！");
            window.toggleSettings(false);
        };

        window.checkBeforeUpload = () => {
            if (Date.now() - lastRequestTimestamp < 30000) return alert("API 冷卻中，請稍候。");
            if (!localStorage.getItem('user_gemini_key')) return window.toggleSettings(true);
            document.getElementById('cameraInput').click();
        };

        window.handleAiUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            window.toggleLoading(true, "Step 1: Compressing...");
            const apiKey = localStorage.getItem('user_gemini_key');
            const base64 = await compressImage(file, 800); // 壓縮至 800px 確保不卡 TPM

            let success = false;
            let errorMsg = "";

            // --- 核心救災邏輯：循環嘗試所有可用模型 ---
            const genAI = new GoogleGenerativeAI(apiKey);
            
            for (const modelId of MODELS_TO_TRY) {
                try {
                    window.toggleLoading(true, `Step 2: Trying ${modelId}...`);
                    const model = genAI.getGenerativeModel({ model: modelId });
                    const result = await model.generateContent([
                        "小三英文考卷辨識。輸出：英文 | 翻譯",
                        { inlineData: { data: base64.split(',')[1], mimeType: "image/jpeg" } }
                    ]);

                    const text = result.response.text();
                    processResponse(text);
                    success = true;
                    console.log(`Success with: ${modelId}`);
                    break; // 成功就跳出迴圈
                } catch (err) {
                    console.warn(`Model ${modelId} failed:`, err.message);
                    errorMsg = err.message;
                }
            }

            if (success) {
                alert("辨識成功！");
                lastRequestTimestamp = Date.now();
                localStorage.setItem('last_api_request_time', lastRequestTimestamp);
                startCooldown(35);
            } else {
                alert("所有救災路徑失敗。原因可能是：\n1. API Key 無效\n2. 配額真的被扣光了\n錯誤訊息：" + errorMsg);
            }
            
            window.toggleLoading(false);
            e.target.value = ''; 
        };

        function startCooldown(duration) {
            const btn = document.getElementById('mainScanBtn');
            const txt = document.getElementById('btnText');
            const tip = document.getElementById('quotaTip');
            if(!btn) return;
            btn.classList.add('btn-disabled');
            btn.disabled = true;
            if(tip) tip.classList.remove('hidden');
            let sec = duration;
            const timer = setInterval(() => {
                if(txt) txt.innerText = `冷卻中 (${sec--}s)`;
                if (sec < 0) {
                    clearInterval(timer);
                    btn.classList.remove('btn-disabled');
                    btn.disabled = false;
                    if(tip) tip.classList.add('hidden');
                    if(txt) txt.innerText = "開始拍照";
                }
            }, 1000);
        }

        function processResponse(text) {
            text.split('\n').forEach(line => {
                if (line.includes('|')) {
                    let [word, trans] = line.split('|').map(s => s.trim());
                    word = word.replace(/^[0-9]+[\.\s]*/, '').replace(/^\(\s*\)/, '');
                    if (word && trans) db.push({ id: Date.now() + Math.random(), word, trans });
                }
            });
            window.saveDB();
        }

        window.saveDB = () => {
            localStorage.setItem('studyDB_final', JSON.stringify(db));
            updateUI();
        };

        function updateUI() {
            const list = document.getElementById('itemList');
            const tip = document.getElementById('emptyTip');
            if(tip) tip.classList.toggle('hidden', db.length > 0);
            if(list) {
                list.innerHTML = db.map(item => `
                    <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                        <div onclick="window.speak('${item.word}')" class="cursor-pointer flex-1">
                            <div class="font-bold text-indigo-900 text-lg">${item.word}</div>
                            <div class="text-[10px] text-slate-400 font-medium">${item.trans}</div>
                        </div>
                        <button onclick="window.deleteItem(${item.id})" class="w-10 h-10 text-slate-200 hover:text-red-400 p-2"><i class="fas fa-times"></i></button>
                    </div>
                `).reverse().join('');
            }
        }

        window.deleteItem = (id) => {
            if(confirm("刪除這題嗎？")) { db = db.filter(i => i.id !== id); window.saveDB(); }
        };

        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US'; u.rate = 0.8;
            window.speechSynthesis.speak(u);
        };

        window.switchTab = (name) => {
            document.getElementById('listPage').classList.toggle('hidden', name !== 'list');
            document.getElementById('quizPage').classList.toggle('hidden', name !== 'quiz');
            document.getElementById('aiSection').classList.toggle('hidden', name === 'quiz');
            
            const btnList = document.getElementById('tabBtnList');
            const btnQuiz = document.getElementById('tabBtnQuiz');
            btnList.className = name === 'list' ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
            btnQuiz.className = name === 'quiz' ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
        };

        window.startQuiz = () => {
            if (db.length === 0) return alert("題庫沒單字。");
            renderQuiz(0); window.switchTab('quiz');
        };

        function renderQuiz(idx) {
            const item = db[idx];
            const card = document.getElementById('quizCard');
            card.innerHTML = `
                <div class="text-slate-300 text-[10px] mb-8 font-bold uppercase tracking-widest">Question ${idx + 1} / ${db.length}</div>
                <button onclick="window.speak('${item.word}')" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto mb-6 shadow-xl active:scale-95 transition-all"><i class="fas fa-volume-up text-3xl"></i></button>
                <div class="text-indigo-500 font-bold text-xl mb-10">${item.trans}</div>
                <input type="text" id="ansIn" class="w-full border-b-2 border-slate-200 text-3xl text-center p-2 mb-10 outline-none focus:border-indigo-500 uppercase font-bold" placeholder="..." autocomplete="off">
                <button onclick="window.checkAns(${idx})" class="w-full bg-slate-900 text-white py-5 rounded-3xl font-bold text-xl">檢查答案</button>
            `;
            window.speak(item.word);
            setTimeout(() => document.getElementById('ansIn').focus(), 400);
        }

        window.checkAns = (idx) => {
            const input = document.getElementById('ansIn');
            const user = input.value.trim().toLowerCase().replace(/[.?!,]/g, '');
            const correct = db[idx].word.trim().toLowerCase().replace(/[.?!,]/g, '');
            if (user === correct) {
                document.getElementById('quizCard').classList.add('correct-flash');
                setTimeout(() => {
                    document.getElementById('quizCard').classList.remove('correct-flash');
                    if (idx + 1 < db.length) renderQuiz(idx + 1);
                    else { alert("🎉 全對！弟弟太棒了！"); window.switchTab('list'); }
                }, 600);
            } else {
                alert(`正確答案是：${db[idx].word}`);
                window.speak(db[idx].word);
            }
        };

        window.exportData = () => {
            const b = new Blob([JSON.stringify(db)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(b);
            a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        };
    </script>
</body>
</html>
