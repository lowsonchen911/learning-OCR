<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .btn-disabled { opacity: 0.4 !important; cursor: not-allowed !important; pointer-events: none; filter: grayscale(1); }
        .correct-flash { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
    </style>
</head>
<body class="pb-28">

    <header class="bg-indigo-900 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center">
                    <i class="fas fa-brain mr-2 text-indigo-400"></i>AI 助手
                </h1>
                <p class="text-[9px] text-indigo-300 font-bold uppercase tracking-widest">
                    Version: 2026.04.24-19 (Bug Patch: Scope Fix)
                </p>
            </div>
            <button onclick="window.toggleSettings()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20 transition-all">
                <i class="fas fa-cog text-xl text-yellow-300"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <section id="settingsSection" class="hidden mb-6 bg-slate-800 text-white rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold flex items-center text-indigo-300"><i class="fas fa-sliders-h mr-2"></i> 管理與設定</h3>
                <button onclick="window.toggleSettings(false)"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="在此輸入 Key" class="w-full bg-slate-700 rounded-xl p-3 text-sm mt-1 outline-none text-white border border-slate-600 focus:border-indigo-400">
                </div>
                
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">AI 模型 (若 404 請切換)</label>
                    <select id="modelSelect" class="w-full bg-slate-700 rounded-xl p-3 text-sm mt-1 outline-none text-white border border-slate-600">
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash (推薦：額度鬆)</option>
                        <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash (最新：速度快)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button onclick="window.saveSettings()" class="col-span-2 bg-indigo-600 py-3 rounded-xl font-bold active:scale-95 transition-all">儲存設定</button>
                    <button onclick="window.fullHardReset()" class="bg-red-500/20 text-red-400 py-2 rounded-xl text-[10px] border border-red-500/30">重置冷卻</button>
                    <button onclick="window.exportData()" class="bg-slate-700 py-2 rounded-xl text-[10px] border border-slate-600">備份題庫</button>
                </div>
            </div>
        </section>

        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-200 text-center">
                <div id="idleUI">
                    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-camera text-3xl"></i>
                    </div>
                    <h2 class="font-bold text-slate-700 text-lg mb-6">辨識考卷單字</h2>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden">
                    <button id="mainScanBtn" onclick="window.checkBeforeUpload()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg transition-all active:scale-95">
                        <i class="fas fa-expand-arrows-alt mr-2 text-yellow-300"></i> <span id="btnText">拍考卷開始</span>
                    </button>
                    <p id="quotaTip" class="text-[10px] text-red-500 mt-3 hidden italic font-bold">⚠️ Google 伺服器排隊中，請稍候...</p>
                </div>

                <div id="loadingUI" class="hidden py-10">
                    <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-600 mb-4"></i>
                    <p class="text-indigo-600 font-bold animate-pulse text-lg">AI 正在努力翻譯中...</p>
                    <p id="debugStatus" class="text-[10px] text-slate-400 mt-2 font-mono uppercase tracking-tighter">Initializing Model...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200/50 p-1 rounded-2xl mb-6 shadow-inner">
            <button onclick="window.switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600 transition-all">題庫管理</button>
            <button onclick="window.startQuiz()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500 transition-all">練習模式</button>
        </div>

        <section id="listPage">
            <div id="emptyTip" class="text-center py-20 text-slate-300 hidden font-bold">還沒加入單字喔！</div>
            <div id="itemList" class="space-y-3"></div>
        </section>

        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[2.5rem] shadow-2xl p-8 text-center min-h-[450px] flex flex-col justify-center border border-indigo-50"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-lg border-t flex justify-around p-5 shadow-lg z-40">
        <button onclick="window.switchTab('list')" class="flex flex-col items-center text-indigo-600"><i class="fas fa-home text-xl"></i><span class="text-[10px] mt-1 font-bold">首頁</span></button>
        <button onclick="window.startQuiz()" class="flex flex-col items-center text-slate-400"><i class="fas fa-pen-nib text-xl"></i><span class="text-[10px] mt-1 font-bold">練習</span></button>
    </nav>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // 全域資料與狀態
        let db = JSON.parse(localStorage.getItem('studyDB_final')) || [];
        let lastRequestTimestamp = parseInt(localStorage.getItem('last_api_request_time')) || 0;

        // --- 修復：顯式掛載動畫開關到 window ---
        window.toggleLoading = (s) => {
            document.getElementById('idleUI').classList.toggle('hidden', s);
            document.getElementById('loadingUI').classList.toggle('hidden', !s);
        };

        // 圖片壓縮
        const compressImage = (file, maxWidth) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (ev) => {
                    const img = new Image();
                    img.src = ev.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = scale < 1 ? maxWidth : img.width;
                        canvas.height = scale < 1 ? img.height * scale : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        };

        window.onload = () => {
            const savedKey = localStorage.getItem('user_gemini_key');
            const savedModel = localStorage.getItem('user_model_choice');
            if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
            if (savedModel) document.getElementById('modelSelect').value = savedModel;
            else window.toggleSettings(true);
            
            updateUI();
            checkAndResumeCooldown();

            const camInput = document.getElementById('cameraInput');
            if (camInput) {
                camInput.onchange = null;
                camInput.addEventListener('change', window.handleAiUpload);
            }
        };

        window.fullHardReset = () => {
            localStorage.setItem('last_api_request_time', 0);
            location.reload();
        };

        function checkAndResumeCooldown() {
            const now = Date.now();
            const diff = now - lastRequestTimestamp;
            if (diff < 35000) startCooldown(Math.ceil((35000 - diff) / 1000));
        }

        window.toggleSettings = (show = null) => {
            const sec = document.getElementById('settingsSection');
            if (show === true) sec.classList.remove('hidden');
            else if (show === false) sec.classList.add('hidden');
            else sec.classList.toggle('hidden');
        };

        window.saveSettings = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            const model = document.getElementById('modelSelect').value;
            localStorage.setItem('user_gemini_key', key);
            localStorage.setItem('user_model_choice', model);
            alert("設定已儲存！");
            window.toggleSettings(false);
        };

        window.checkBeforeUpload = () => {
            const now = Date.now();
            if (now - lastRequestTimestamp < 35000) {
                alert(`請再等幾秒鐘，API 正在排隊中。`);
                return;
            }
            if (!localStorage.getItem('user_gemini_key')) {
                alert("請點齒輪輸入 API Key！");
                window.toggleSettings(true);
            } else {
                document.getElementById('cameraInput').click();
            }
        };

        window.handleAiUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            window.toggleLoading(true); // 這裡之前報錯，現在已修復
            lastRequestTimestamp = Date.now();
            localStorage.setItem('last_api_request_time', lastRequestTimestamp);
            const debug = document.getElementById('debugStatus');

            try {
                debug.innerText = "Step 1: Compressing Image...";
                const compressed = await compressImage(file, 1024);
                
                const apiKey = localStorage.getItem('user_gemini_key');
                const modelChoice = localStorage.getItem('user_model_choice') || "gemini-2.0-flash";
                
                debug.innerText = `Step 2: Sending to ${modelChoice}...`;
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: modelChoice });

                const prompt = "辨識這張小三英文考卷中的單字。格式：英文 | 翻譯";
                const result = await model.generateContent([
                    prompt, { inlineData: { data: compressed.split(',')[1], mimeType: "image/jpeg" } }
                ]);

                processResponse(result.response.text());
                alert("辨識成功！");
                startCooldown(40);
            } catch (err) {
                console.error(err);
                if (err.message.includes("429")) {
                    alert("【配額錯誤】每分鐘限 2 次掃描。請等一分鐘或換成 1.5 Flash。");
                    startCooldown(60);
                } else if (err.message.includes("404")) {
                    alert("【找不到模型】伺服器目前不支援此型號，請在設定中切換。");
                } else {
                    alert("發生錯誤: " + err.message);
                }
            } finally {
                window.toggleLoading(false);
                e.target.value = ''; 
            }
        };

        function startCooldown(duration) {
            const btn = document.getElementById('mainScanBtn');
            const txt = document.getElementById('btnText');
            const tip = document.getElementById('quotaTip');
            if(!btn) return;

            btn.classList.add('btn-disabled');
            btn.disabled = true;
            if(tip) tip.classList.remove('hidden');
            
            let sec = duration;
            const timer = setInterval(() => {
                if(txt) txt.innerText = `冷卻中 (${sec--}s)`;
                if (sec < 0) {
                    clearInterval(timer);
                    btn.classList.remove('btn-disabled');
                    btn.disabled = false;
                    if(tip) tip.classList.add('hidden');
                    if(txt) txt.innerText = "拍考卷開始";
                }
            }, 1000);
        }

        function processResponse(text) {
            text.split('\n').forEach(line => {
                if (line.includes('|')) {
                    let [word, trans] = line.split('|').map(s => s.trim());
                    word = word.replace(/^[0-9]+[\.\s]*/, '').replace(/^\(\s*\)/, '');
                    if (word && trans) db.push({ id: Date.now() + Math.random(), word, trans });
                }
            });
            window.saveDB();
        }

        window.saveDB = () => {
            localStorage.setItem('studyDB_final', JSON.stringify(db));
            updateUI();
        };

        function updateUI() {
            const list = document.getElementById('itemList');
            const tip = document.getElementById('emptyTip');
            if(tip) tip.classList.toggle('hidden', db.length > 0);
            if(list) {
                list.innerHTML = db.map(item => `
                    <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                        <div onclick="window.speak('${item.word}')" class="cursor-pointer flex-1">
                            <div class="font-bold text-indigo-900 text-lg">${item.word}</div>
                            <div class="text-[10px] text-slate-400 font-medium">${item.trans}</div>
                        </div>
                        <button onclick="window.deleteItem(${item.id})" class="w-10 h-10 text-slate-200 hover:text-red-400 p-2"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `).reverse().join('');
            }
        }

        window.deleteItem = (id) => {
            if(confirm("確定要刪除這題嗎？")) { db = db.filter(i => i.id !== id); window.saveDB(); }
        };

        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US'; u.rate = 0.8;
            window.speechSynthesis.speak(u);
        };

        window.switchTab = (name) => {
            document.getElementById('listPage').classList.toggle('hidden', name !== 'list');
            document.getElementById('quizPage').classList.toggle('hidden', name !== 'quiz');
            document.getElementById('aiSection').classList.toggle('hidden', name === 'quiz');
            
            const btnList = document.getElementById('tabBtnList');
            const btnQuiz = document.getElementById('tabBtnQuiz');
            btnList.className = name === 'list' ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
            btnQuiz.className = name === 'quiz' ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
        };

        window.startQuiz = () => {
            if (db.length === 0) return alert("題庫沒東西喔！");
            renderQuiz(0); window.switchTab('quiz');
        };

        function renderQuiz(idx) {
            const item = db[idx];
            const card = document.getElementById('quizCard');
            card.innerHTML = `
                <div class="text-slate-300 text-[10px] mb-8 font-bold uppercase tracking-widest">Question ${idx + 1} / ${db.length}</div>
                <button onclick="window.speak('${item.word}')" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto mb-6 shadow-xl active:scale-95 transition-all"><i class="fas fa-volume-up text-3xl"></i></button>
                <div class="text-indigo-500 font-bold text-xl mb-10">${item.trans}</div>
                <input type="text" id="ansIn" class="w-full border-b-2 border-slate-200 text-3xl text-center p-2 mb-10 outline-none focus:border-indigo-500 uppercase font-bold" placeholder="..." autocomplete="off">
                <button onclick="window.checkAns(${idx})" class="w-full bg-slate-900 text-white py-5 rounded-3xl font-bold text-xl shadow-lg">檢查答案</button>
            `;
            window.speak(item.word);
            setTimeout(() => document.getElementById('ansIn').focus(), 400);
        }

        window.checkAns = (idx) => {
            const input = document.getElementById('ansIn');
            const user = input.value.trim().toLowerCase().replace(/[.?!,]/g, '');
            const correct = db[idx].word.trim().toLowerCase().replace(/[.?!,]/g, '');
            if (user === correct) {
                document.getElementById('quizCard').classList.add('correct-flash');
                setTimeout(() => {
                    document.getElementById('quizCard').classList.remove('correct-flash');
                    if (idx + 1 < db.length) renderQuiz(idx + 1);
                    else { alert("🎉 全對！弟弟太強了！"); window.switchTab('list'); }
                }, 600);
            } else {
                alert(`喔喔！正確答案是：${db[idx].word}`);
                window.speak(db[idx].word);
            }
        };

        window.exportData = () => {
            const b = new Blob([JSON.stringify(db)], {type:'application/json'});
            const url = URL.createObjectURL(b);
            const a = document.createElement('a'); a.href = url;
            a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        };

        window.importData = () => {
            const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
            i.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => { try { db = JSON.parse(ev.target.result); window.saveDB(); alert("成功還原題庫！"); } catch(e) { alert("讀取失敗。"); } };
                reader.readAsText(e.target.files[0]);
            };
            i.click();
        };
    </script>
</body>
</html>
