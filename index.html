<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI (直連版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f0f2f5; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto space-y-6">
        <div class="text-center py-4">
            <h1 class="text-2xl font-black text-indigo-600 italic">小三英文 AI 直連版</h1>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Version: 2026.04.24-22 (Raw Fetch v1)</p>
        </div>

        <div class="bg-white rounded-[2rem] p-6 shadow-xl border border-white">
            <div id="setupArea" class="space-y-4">
                <input type="password" id="apiKey" placeholder="在此輸入 API Key" class="w-full p-4 bg-gray-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <button onclick="saveKey()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold active:scale-95 transition-all">儲存並啟動</button>
            </div>

            <div id="mainUI" class="hidden space-y-6">
                <div class="flex items-center justify-between text-xs font-bold text-gray-400 px-2">
                    <span>模式：Gemini 1.5 Flash (v1)</span>
                    <button onclick="resetApp()" class="text-red-400">清除 Key</button>
                </div>
                
                <input type="file" id="imgInput" accept="image/*" class="hidden" onchange="handleProcess(event)">
                <button id="scanBtn" onclick="document.getElementById('imgInput').click()" class="w-full bg-indigo-600 text-white py-6 rounded-[1.5rem] font-bold shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3">
                    <i class="fas fa-camera text-xl"></i>
                    <span>開始辨識單字</span>
                </button>

                <div id="status" class="hidden text-center py-4">
                    <i class="fas fa-circle-notch spin text-indigo-500 text-3xl mb-2"></i>
                    <p class="text-indigo-600 font-bold animate-pulse text-sm">正在繞過路由直接連線中...</p>
                </div>
            </div>
        </div>

        <div id="resultArea" class="space-y-2"></div>
    </div>

    <script>
        // 初始化載入
        window.onload = () => {
            const key = localStorage.getItem('raw_gemini_key');
            if(key) {
                document.getElementById('apiKey').value = key;
                showMainUI();
            }
            renderList();
        };

        function saveKey() {
            const val = document.getElementById('apiKey').value.trim();
            if(!val.startsWith("AIza")) return alert("格式不對。");
            localStorage.setItem('raw_gemini_key', val);
            showMainUI();
        }

        function showMainUI() {
            document.getElementById('setupArea').classList.add('hidden');
            document.getElementById('mainUI').classList.remove('hidden');
        }

        function resetApp() {
            localStorage.clear();
            location.reload();
        }

        async function handleProcess(e) {
            const file = e.target.files[0];
            if(!file) return;

            const btn = document.getElementById('scanBtn');
            const status = document.getElementById('status');
            btn.classList.add('hidden');
            status.classList.remove('hidden');

            try {
                const base64Data = await toBase64(file);
                const key = localStorage.getItem('raw_gemini_key');
                
                // --- 核心：手動構建 v1 穩定路徑，不使用 SDK ---
                const modelId = "gemini-1.5-flash"; // 2026 最穩定的型號
                const url = `https://generativelanguage.googleapis.com/v1/models/${modelId}:generateContent?key=${key}`;

                const payload = {
                    contents: [{
                        parts: [
                            { text: "辨識英文單字與翻譯。格式：英文 | 翻譯" },
                            { inline_data: { mime_type: file.type, data: base64Data.split(',')[1] } }
                        ]
                    }]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                processText(aiText);
                alert("辨識成功！");

            } catch (err) {
                console.error(err);
                alert("連線失敗：" + err.message);
            } finally {
                btn.classList.remove('hidden');
                status.classList.add('hidden');
                e.target.value = '';
            }
        }

        function processText(text) {
            let db = JSON.parse(localStorage.getItem('studyDB_raw') || '[]');
            text.split('\n').forEach(line => {
                if(line.includes('|')) {
                    let [word, trans] = line.split('|').map(s => s.trim());
                    if(word && trans) db.push({ id: Date.now()+Math.random(), word, trans });
                }
            });
            localStorage.setItem('studyDB_raw', JSON.stringify(db));
            renderList();
        }

        function renderList() {
            const container = document.getElementById('resultArea');
            const db = JSON.parse(localStorage.getItem('studyDB_raw') || '[]');
            container.innerHTML = db.reverse().map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border-l-4 border-indigo-500">
                    <div>
                        <div class="font-bold text-slate-800">${item.word}</div>
                        <div class="text-[10px] text-gray-400 font-medium">${item.trans}</div>
                    </div>
                    <button onclick="speak('${item.word}')" class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center active:scale-90"><i class="fas fa-volume-up"></i></button>
                </div>
            `).join('');
        }

        function speak(t) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        function toBase64(file) {
            return new Promise((r, j) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => r(reader.result);
                reader.onerror = e => j(e);
            });
        }
    </script>
</body>
</html>
