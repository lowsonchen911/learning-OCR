<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .quiz-card { transition: all 0.3s ease; }
        .correct-flash { animation: flash 0.6s ease; }
        @keyframes flash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
    </style>
</head>
<body class="pb-28">

    <header class="bg-indigo-700 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center">
                    <i class="fas fa-magic mr-2 text-yellow-300"></i>AI 助手
                </h1>
                <p id="versionTag" class="text-[9px] text-indigo-300 font-bold uppercase tracking-widest">
                    Version: 2026.04.24-06
                </p>
            </div>
            <button onclick="toggleSettings()" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-full hover:bg-white/20 transition-all">
                <i class="fas fa-cog text-xl text-yellow-300"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        
        <section id="settingsSection" class="hidden mb-6 bg-slate-800 text-white rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold flex items-center"><i class="fas fa-key mr-2 text-yellow-400"></i>我的 API 設定</h3>
                <button onclick="toggleSettings()" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold">Google AI Studio API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="貼上 AIza... 開頭的 Key" 
                           class="w-full bg-slate-700 border-none rounded-xl p-4 text-sm mt-1 focus:ring-2 focus:ring-yellow-400 outline-none transition-all">
                </div>
                <div class="flex gap-2">
                    <button onclick="saveSettings()" class="flex-1 bg-yellow-500 text-slate-900 py-3 rounded-xl font-bold hover:bg-yellow-400 transition-all">儲存並隱藏</button>
                    <button onclick="exportData()" class="px-4 bg-slate-600 rounded-xl hover:bg-slate-500"><i class="fas fa-download"></i></button>
                    <button onclick="importData()" class="px-4 bg-slate-600 rounded-xl hover:bg-slate-500"><i class="fas fa-upload"></i></button>
                </div>
            </div>
        </section>

        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-200 text-center">
                <div id="idleUI">
                    <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-camera text-3xl"></i>
                    </div>
                    <h2 class="font-bold text-slate-700 text-lg mb-6">新增學習內容</h2>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="window.handleAiUpload(event)">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="checkKeyBeforeUpload()" class="col-span-2 bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                            <i class="fas fa-expand mr-2 text-yellow-300"></i> 拍考卷辨識
                        </button>
                    </div>
                </div>

                <div id="loadingUI" class="hidden py-10">
                    <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-600 mb-4"></i>
                    <p class="text-indigo-600 font-bold animate-pulse">AI 正在思考中...</p>
                    <p id="debugStatus" class="text-[10px] text-slate-400 mt-2 font-mono">Connecting to Gemini...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200/50 p-1 rounded-2xl mb-6 shadow-inner">
            <button onclick="window.switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600">題庫管理</button>
            <button onclick="window.startQuiz()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500">練習模式</button>
        </div>

        <section id="listPage">
            <div id="emptyTip" class="text-center py-20 text-slate-300 hidden font-bold">空空如也，拍張考卷吧！</div>
            <div id="itemList" class="space-y-3"></div>
        </section>

        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[2.5rem] shadow-2xl p-8 text-center min-h-[450px] flex flex-col justify-center border border-indigo-50 quiz-card">
                </div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-lg border-t flex justify-around p-5 shadow-lg z-40">
        <button onclick="window.switchTab('list')" class="flex flex-col items-center text-indigo-600">
            <i class="fas fa-home text-xl"></i><span class="text-[10px] mt-1 font-bold">主頁</span>
        </button>
        <button onclick="window.startQuiz()" class="flex flex-col items-center text-slate-400">
            <i class="fas fa-pen-nib text-xl"></i><span class="text-[10px] mt-1 font-bold">測驗</span>
        </button>
    </nav>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        let db = JSON.parse(localStorage.getItem('studyDB_vFinal')) || [];
        let currentIdx = 0;

        // 初始化
        window.onload = () => {
            const savedKey = localStorage.getItem('user_gemini_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            } else {
                toggleSettings(true);
            }
            window.updateUI();
        };

        // 設定控制
        window.toggleSettings = (show = null) => {
            const sec = document.getElementById('settingsSection');
            if (show === true) sec.classList.remove('hidden');
            else if (show === false) sec.classList.add('hidden');
            else sec.classList.toggle('hidden');
        };

        window.saveSettings = () => {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key.startsWith("AIza")) return alert("API Key 格式似乎不對喔！");
            localStorage.setItem('user_gemini_key', key);
            alert("API 設定已儲存！");
            window.toggleSettings(false);
        };

        window.checkKeyBeforeUpload = () => {
            const key = localStorage.getItem('user_gemini_key');
            if (!key) {
                alert("請先設定 API Key！");
                window.toggleSettings(true);
            } else {
                document.getElementById('cameraInput').click();
            }
        };

        // AI 處理邏輯
        window.handleAiUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const apiKey = localStorage.getItem('user_gemini_key');
            toggleLoading(true);
            const status = document.getElementById('debugStatus');

            try {
                const base64 = await toBase64(file);
                const genAI = new GoogleGenerativeAI(apiKey);
                
                // 使用最新穩定的 ID，並針對可能的 404 做處理
                status.innerText = "Model: gemini-1.5-flash...";
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const prompt = "這是一張小學三年級英文考卷，請精確辨識其中的英文單字與英文句子，並翻譯成繁體中文。請只輸出格式：英文 | 繁體中文，每行一題，不要有其他廢話。";
                
                const result = await model.generateContent([
                    prompt, { inlineData: { data: base64.split(',')[1], mimeType: file.type } }
                ]);

                const text = result.response.text();
                processResponse(text);
                alert("辨識成功！題目已加入。");
            } catch (err) {
                console.error(err);
                if (err.message.includes("not found")) {
                    alert("AI 模型連線失敗 (404)。請確認您的 API Key 是否具備 Gemini 1.5 Flash 權限。");
                } else {
                    alert("AI 辨識發生錯誤: " + err.message);
                }
            } finally {
                toggleLoading(false);
                e.target.value = '';
            }
        };

        function processResponse(text) {
            const lines = text.split('\n');
            lines.forEach(line => {
                if (line.includes('|')) {
                    let [word, trans] = line.split('|').map(s => s.trim());
                    // 清理雜訊
                    word = word.replace(/^[0-9]+[\.\s]*/, '').replace(/^\(\s*\)/, '');
                    if (word && trans) {
                        db.push({ id: Date.now() + Math.random(), word, trans });
                    }
                }
            });
            window.saveDB();
        }

        window.saveDB = () => {
            localStorage.setItem('studyDB_vFinal', JSON.stringify(db));
            window.updateUI();
        };

        window.updateUI = () => {
            const list = document.getElementById('itemList');
            const tip = document.getElementById('emptyTip');
            if(tip) tip.classList.toggle('hidden', db.length > 0);
            if(list) {
                list.innerHTML = db.map(item => `
                    <div class="bg-white p-5 rounded-3xl shadow-sm flex justify-between items-center mb-2 border border-slate-100 hover:border-indigo-300 transition-all">
                        <div onclick="window.speak('${item.word}')" class="cursor-pointer flex-1">
                            <div class="font-bold text-indigo-900 text-lg">${item.word}</div>
                            <div class="text-xs text-slate-400 font-medium">${item.trans}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.speak('${item.word}')" class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center active:scale-90 transition-transform"><i class="fas fa-volume-up text-sm"></i></button>
                            <button onclick="window.deleteItem(${item.id})" class="w-10 h-10 text-slate-200 hover:text-red-400 p-2"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `).reverse().join('');
            }
        };

        window.deleteItem = (id) => {
            if(confirm("確定刪除嗎？")) {
                db = db.filter(i => i.id !== id);
                window.saveDB();
            }
        };
