<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f0f7ff; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-24">

    <header class="bg-indigo-600 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center">
                    <i class="fas fa-robot mr-2 text-yellow-300"></i>AI 英文助手
                </h1>
                <p class="text-[10px] text-indigo-200">PREMIUM PAID EDITION</p>
            </div>
            <div class="flex gap-2 text-[10px]">
                <button onclick="exportData()" class="bg-indigo-500 px-2 py-1 rounded">備份</button>
                <button onclick="importData()" class="bg-indigo-500 px-2 py-1 rounded">還原</button>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2rem] p-6 shadow-lg border-2 border-indigo-100 text-center">
                <div id="idleUI">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-camera text-2xl"></i>
                    </div>
                    <h2 class="font-bold text-slate-700">拍照辨識考卷</h2>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg mt-4 active:scale-95 transition-all">
                        <i class="fas fa-magic mr-2"></i> 拍考卷 / 選照片
                    </button>
                </div>
                <div id="loadingUI" class="hidden py-8">
                    <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-500 mb-4"></i>
                    <p class="text-indigo-600 font-bold animate-pulse">AI 正在努力翻譯中...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200 p-1 rounded-2xl mb-4">
            <button onclick="switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600">目前題庫</button>
            <button onclick="startQuiz()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500">測驗模式</button>
        </div>

        <section id="listPage">
            <div id="emptyTip" class="text-center py-10 text-slate-300 hidden">尚未加入單字</div>
            <div id="itemList" class="space-y-3"></div>
        </section>

        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[2.5rem] shadow-2xl p-8 text-center min-h-[400px] flex flex-col justify-center border-4 border-indigo-50"></div>
        </section>
    </main>

    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t flex justify-around p-4 shadow-lg z-40">
        <button onclick="switchTab('list')" class="flex flex-col items-center text-indigo-600"><i class="fas fa-home text-xl"></i><span class="text-[10px] mt-1 font-bold">主頁</span></button>
        <button onclick="startQuiz()" class="flex flex-col items-center text-slate-400"><i class="fas fa-play-circle text-xl"></i><span class="text-[10px] mt-1 font-bold">開始練習</span></button>
    </nav>

    <script type="module">
        // === 這裡請貼上你的 API KEY ===
        const API_KEY = "AIzaSyAG8ZRv5S2nddcjY1YlMp-llnWhdB1lb0Y"; 
        
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        let db = JSON.parse(localStorage.getItem('studyDB_final')) || [];
        let currentIdx = 0;

        // 初始化：綁定所有事件
        window.onload = () => {
            updateUI();
            const fileInput = document.getElementById('cameraInput');
            if (fileInput) {
                fileInput.addEventListener('change', handleFileUpload);
            }
        };

        // 確保按鈕能呼叫到函數
        window.switchTab = switchTab;
        window.startQuiz = startQuiz;
        window.checkAns = checkAns;
        window.exportData = exportData;
        window.importData = importData;
        window.deleteItem = deleteItem;
        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.8;
            window.speechSynthesis.speak(u);
        };

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (!API_KEY || API_KEY.includes("貼上你的")) return alert("請先設定 API Key");

            toggleLoading(true);
            try {
                const base64 = await toBase64(file);
                const genAI = new GoogleGenerativeAI(API_KEY);
                
                // 使用目前最強大、最穩定的 Flash 模型 ID
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const prompt = "這是一張小學三年級英文考卷。請辨識圖中所有的單字與句子，並翻譯成繁體中文。請只輸出：單字 | 翻譯，每行一個。";
                
                const result = await model.generateContent([
                    prompt, { inlineData: { data: base64.split(',')[1], mimeType: file.type } }
                ]);

                const text = result.response.text();
                text.split('\n').forEach(line => {
                    if (line.includes('|')) {
                        let [word, trans] = line.split('|').map(s => s.trim());
                        word = word.replace(/^[0-9]+[\.\s]*/, ''); // 移除前導題號
                        if (word && trans) db.push({ id: Date.now() + Math.random(), word, trans });
                    }
                });
                save();
                alert("辨識完成！題目已加入。");
            } catch (err) {
                console.error(err);
                alert("AI 錯誤：" + err.message);
            } finally {
                toggleLoading(false);
                e.target.value = '';
            }
        }

        function save() {
            localStorage.setItem('studyDB_final', JSON.stringify(db));
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('itemList');
            const tip = document.getElementById('emptyTip');
            if (tip) tip.classList.toggle('hidden', db.length > 0);
            if (list) {
                list.innerHTML = db.map(item => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                        <div onclick="speak('${item.word}')" class="cursor-pointer">
                            <div class="font-bold text-indigo-900">${item.word}</div>
                            <div class="text-[10px] text-slate-400">${item.trans}</div>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-slate-200 hover:text-red-400"><i class="fas fa-times"></i></button>
                    </div>
                `).reverse().join('');
            }
        }

        function deleteItem(id) {
            if(confirm("確定刪除？")) { db = db.filter(i => i.id !== id); save(); }
        }

        function switchTab(name) {
            document.getElementById('listPage').classList.toggle('hidden', name !== 'list');
            document.getElementById('quizPage').classList.toggle('hidden', name !== 'quiz');
            document.getElementById('aiSection').classList.toggle('hidden', name === 'quiz');
        }

        function startQuiz() {
            if (db.length === 0) return alert("題庫沒東西喔！");
            currentIdx = 0; switchTab('quiz'); renderQuiz();
        }

        function renderQuiz() {
            const item = db[currentIdx];
            const card = document.getElementById('quizCard');
            card.innerHTML = `
                <div class="text-slate-300 text-[10px] mb-8 font-bold">${currentIdx + 1} / ${db.length}</div>
                <button onclick="speak('${item.word}')" class="w-24 h-24 bg-indigo-600 text-white rounded-full mx-auto mb-6 shadow-xl active:scale-90 transition-all"><i class="fas fa-volume-up text-3xl"></i></button>
                <div class="text-indigo-400 font-bold mb-8 text-xl">${item.trans}</div>
                <input type="text" id="ansIn" class="w-full border-b-2 border-slate-200 text-3xl text-center p-2 mb-10 outline-none focus:border-indigo-500 uppercase font-bold" placeholder="輸入單字..." autocomplete="off">
                <button onclick="checkAns()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-xl">檢查答案</button>
            `;
            window.speak(item.word);
            setTimeout(() => document.getElementById('ansIn').focus(), 400);
        }

        function checkAns() {
            const user = document.getElementById('ansIn').value.trim().toLowerCase().replace(/[.?!,]/g, '');
            const correct = db[currentIdx].word.trim().toLowerCase().replace(/[.?!,]/g, '');
            if (user === correct) {
                currentIdx++;
                if (currentIdx < db.length) renderQuiz();
                else { alert("🎉 全數練習完成！"); switchTab('list'); }
            } else {
                alert(`正確答案是：${db[currentIdx].word}`);
                window.speak(db[currentIdx].word);
            }
        }

        function toBase64(file) {
            return new Promise((r, j) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => r(reader.result);
                reader.onerror = e => j(e);
            });
        }

        function toggleLoading(s) {
            document.getElementById('idleUI').classList.toggle('hidden', s);
            document.getElementById('loadingUI').classList.toggle('hidden', !s);
        }

        function exportData() {
            const b = new Blob([JSON.stringify(db)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(b);
            a.download = 'study_data.json'; a.click();
        }

        function importData() {
            const i = document.createElement('input'); i.type = 'file';
            i.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => { db = JSON.parse(ev.target.result); save(); };
                reader.readAsText(e.target.files[0]);
            };
            i.click();
        }
    </script>
</body>
</html>
