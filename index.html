<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手 (核心穩定版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">AI 助手 (穩定版)</h1>
            <button onclick="document.getElementById('settings').classList.toggle('hidden')" class="text-slate-400 p-2">
                <i class="fas fa-cog"></i>
            </button>
        </header>

        <section id="settings" class="hidden mb-6 bg-white p-4 rounded-2xl shadow-sm border">
            <label class="block text-xs font-bold text-slate-400 mb-2 uppercase">API Key</label>
            <input type="password" id="apiKeyInput" placeholder="在此輸入 AIza... 金鑰" class="w-full border rounded-xl p-3 text-sm mb-2 outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="window.saveSettings()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold">儲存並重整</button>
        </section>

        <main id="mainUI">
            <div id="idleState" class="bg-white rounded-[2rem] p-10 text-center shadow-xl border-2 border-dashed border-indigo-50 mb-6">
                <i class="fas fa-camera text-5xl text-indigo-100 mb-4"></i>
                <h2 class="font-bold text-slate-600 mb-6">拍下英文單字</h2>
                <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="window.handleUpload(event)">
                <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all">
                    開始拍照辨識
                </button>
            </div>

            <div id="loadingState" class="hidden bg-white rounded-[2rem] p-12 text-center shadow-xl mb-6">
                <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-600 mb-4 inline-block"></i>
                <p class="text-indigo-600 font-bold animate-pulse">正在辨識中...</p>
            </div>

            <div id="listSection" class="space-y-3">
                <h3 class="font-bold text-slate-400 text-xs uppercase tracking-widest px-2 mb-2">單字庫清單</h3>
                <div id="itemList"></div>
            </div>
        </main>
    </div>

    <script type="module">
        let db = JSON.parse(localStorage.getItem('core_db')) || [];
        // 預設使用 gemini-1.5-flash
        const modelUrl = "models/gemini-1.5-flash:generateContent";

        window.onload = () => {
            const savedKey = localStorage.getItem('core_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            } else {
                document.getElementById('settings').classList.remove('hidden');
            }
            updateUI();
        };

        window.saveSettings = () => {
            const k = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('core_key', k);
            location.reload();
        };

        window.handleUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const key = localStorage.getItem('core_key');
            if (!key) return alert("請先設定 API Key");

            toggleLoader(true);
            
            try {
                const base64 = await compressImage(file);
                const url = `https://generativelanguage.googleapis.com/v1beta/${modelUrl}?key=${key}`;
                
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: "辨識圖中英文單字與中文翻譯。格式：單字 | 翻譯" },
                                   { inline_data: { mime_type: "image/jpeg", data: base64.split(',')[1] } }]
                        }]
                    })
                });

                const data = await resp.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const resultText = data.candidates[0].content.parts[0].text;
                
                resultText.split('\n').forEach(line => {
                    if (line.includes('|')) {
                        let parts = line.split('|').map(s => s.trim());
                        if (parts.length >= 2) {
                            db.push({ id: Date.now() + Math.random(), word: parts[0], trans: parts[1] });
                        }
                    }
                });

                localStorage.setItem('core_db', JSON.stringify(db));
                updateUI();
                alert("辨識成功！");
            } catch (err) {
                console.error(err);
                alert("辨識失敗。如果是 503 錯誤，請等待一分鐘讓伺服器休息再試。");
            } finally {
                toggleLoader(false);
                e.target.value = '';
            }
        };

        function updateUI() {
            const list = document.getElementById('itemList');
            if (db.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-300 text-sm py-10">目前沒有單字，請拍照加入。</p>`;
                return;
            }
            list.innerHTML = db.slice().reverse().map(item => `
                <div class="bg-white p-5 rounded-2xl shadow-sm flex justify-between items-center mb-2 border border-slate-100">
                    <div onclick="window.speak('${item.word}')" class="flex-1 cursor-pointer">
                        <div class="font-bold text-indigo-900 text-lg">${item.word}</div>
                        <div class="text-sm text-slate-400">${item.trans}</div>
                    </div>
                    <button onclick="window.deleteItem(${item.id})" class="text-slate-200 hover:text-red-400 p-2"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('');
        }

        window.deleteItem = (id) => {
            if(confirm("確定要刪除這個單字嗎？")) {
                db = db.filter(i => i.id !== id);
                localStorage.setItem('core_db', JSON.stringify(db));
                updateUI();
            }
        };

        window.speak = (t) => {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        };

        function toggleLoader(show) {
            document.getElementById('idleState').classList.toggle('hidden', show);
            document.getElementById('loadingState').classList.toggle('hidden', !show);
        }

        function compressImage(file) {
            return new Promise((r) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 800;
                        canvas.height = img.height * (800 / img.width);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        r(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }
    </script>
</body>
</html>
