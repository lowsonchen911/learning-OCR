<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小三英文 AI 助手</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f0f7ff; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .correct-bg { animation: correctFlash 0.5s ease; }
        @keyframes correctFlash { 0% { background: white; } 50% { background: #dcfce7; } 100% { background: white; } }
    </style>
</head>
<body class="pb-24">

    <header class="bg-indigo-600 text-white p-6 shadow-xl sticky top-0 z-30 rounded-b-[2rem]">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div>
                <h1 class="text-2xl font-black italic flex items-center">
                    <i class="fas fa-brain mr-2 text-yellow-300"></i>AI 助手
                </h1>
                <p class="text-[10px] text-indigo-200">POWERED BY GEMINI AI</p>
            </div>
            <div class="flex gap-3">
                <button onclick="exportData()" class="text-xs bg-indigo-500 px-2 py-1 rounded hover:bg-indigo-400">備份</button>
                <button onclick="importData()" class="text-xs bg-indigo-500 px-2 py-1 rounded hover:bg-indigo-400">還原</button>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto">
        
        <section id="aiSection" class="mb-6">
            <div class="bg-white rounded-[2rem] p-6 shadow-lg border-2 border-indigo-100 text-center relative overflow-hidden">
                <div id="idleUI">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-camera text-2xl"></i>
                    </div>
                    <h2 class="font-bold text-slate-700 text-lg">考卷自動辨識</h2>
                    <p class="text-slate-400 text-xs mb-4">拍照後 AI 會自動拆解單字並翻譯</p>
                    <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="startAiProcess(event)">
                    <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                        <i class="fas fa-magic mr-2"></i> 拍考卷 / 選照片
                    </button>
                </div>

                <div id="loadingUI" class="hidden py-8">
                    <i class="fas fa-circle-notch loading-spin text-4xl text-indigo-500 mb-4"></i>
                    <p class="text-indigo-600 font-bold animate-pulse">Gemini 正在讀取考卷並翻譯中...</p>
                </div>
            </div>
        </section>

        <div class="flex bg-slate-200 p-1 rounded-2xl mb-4">
            <button onclick="switchTab('list')" id="tabBtnList" class="flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600">我的題庫</button>
            <button onclick="startQuiz()" id="tabBtnQuiz" class="flex-1 py-3 rounded-xl font-bold text-sm text-slate-500">練習考卷</button>
        </div>

        <section id="listPage" class="space-y-3">
            <div id="emptyTip" class="text-center py-10 text-slate-300">
                <i class="fas fa-ghost text-4xl mb-2"></i>
                <p>目前沒有題目，快去拍照吧！</p>
            </div>
            <div id="itemList" class="space-y-3"></div>
        </section>

        <section id="quizPage" class="hidden">
            <div id="quizCard" class="bg-white rounded-[2.5rem] shadow-2xl p-8 text-center min-h-[450px] flex flex-col justify-center border border-indigo-50">
                </div>
        </section>

    </main>

    <nav class="fixed bottom-0 w-full bg-white/80 backdrop-blur-lg border-t flex justify-around p-4 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-40">
        <button onclick="switchTab('list')" class="flex flex-col items-center text-indigo-600">
            <i class="fas fa-home text-xl"></i><span class="text-[10px] mt-1 font-bold">主頁</span>
        </button>
        <button onclick="startQuiz()" class="flex flex-col items-center text-slate-400">
            <i class="fas fa-book-open text-xl"></i><span class="text-[10px] mt-1 font-bold">測驗</span>
        </button>
    </nav>

    <script type="module">
        // ==========================================
        // 核心設定：請在此貼上你的 Gemini API Key
        // ==========================================
        const API_KEY = "AIzaSyAG8ZRv5S2nddcjY1YlMp-llnWhdB1lb0Y"; 
        
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        let db = JSON.parse(localStorage.getItem('studyDB_vFinal')) || [];
        let currentQuizIdx = 0;

        // 初始化
        window.onload = () => { updateUI(); };
        window.startAiProcess = startAiProcess;
        window.switchTab = switchTab;
        window.startQuiz = startQuiz;
        window.speak = speak;
        window.deleteItem = deleteItem;
        window.checkAnswer = checkAnswer;
        window.exportData = exportData;
        window.importData = importData;

        // --- AI 辨識流程 ---
        async function startAiProcess(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (API_KEY === "YOUR_GEMINI_API_KEY") return alert("請先在程式碼中填入 API Key！");

            toggleLoading(true);

            try {
                const base64Img = await toBase64(file);
                const genAI = new GoogleGenerativeAI(API_KEY);
		const model = genAI.getGenerativeModel({ model: "gemini-3-flash" });

                const prompt = `這是一張小三英文考卷。請辨識圖中所有的英文單字與句子，並執行：
                1. 自動修正 OCR 辨識錯誤（如 '1' 改 'l'）。
                2. 確保拼字符合英語法。
                3. 將內容翻譯成繁體中文。
                請嚴格輸出格式為「單字/句子 | 繁體中文翻譯」，每行一個，不要有其他文字。`;

                const result = await model.generateContent([
                    prompt,
                    { inlineData: { data: base64Img.split(',')[1], mimeType: file.type } }
                ]);

                const response = result.response.text();
                processResponse(response);
                alert("AI 辨識成功！已加入題庫。");
            } catch (err) {
                console.error(err);
                alert("辨識失敗，可能是 API Key 錯誤或沒連網：" + err.message);
            } finally {
                toggleLoading(false);
                e.target.value = '';
            }
        }

        function processResponse(text) {
            const lines = text.split('\n');
            lines.forEach(line => {
                if (line.includes('|')) {
                    let [word, trans] = line.split('|').map(s => s.trim());
                    // 智慧過濾題號
                    word = word.replace(/^[0-9]+[\.\s]*/, '').replace(/^\(\s*\)/, '');
                    if (word && trans) {
                        db.push({ id: Date.now() + Math.random(), word, trans });
                    }
                }
            });
            save();
        }

        // --- 功能模組 ---
        function save() {
            localStorage.setItem('studyDB_vFinal', JSON.stringify(db));
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('itemList');
            const tip = document.getElementById('emptyTip');
            tip.classList.toggle('hidden', db.length > 0);
            
            list.innerHTML = db.map((item, idx) => `
                <div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100">
                    <div class="cursor-pointer" onclick="speak('${item.word}')">
                        <div class="font-bold text-indigo-900">${item.word}</div>
                        <div class="text-[10px] text-slate-400">${item.trans}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="speak('${item.word}')" class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center"><i class="fas fa-volume-up text-sm"></i></button>
                        <button onclick="deleteItem(${idx})" class="w-10 h-10 bg-slate-50 text-slate-300 rounded-full flex items-center justify-center"><i class="fas fa-times text-sm"></i></button>
                    </div>
                </div>
            `).reverse().join('');
        }

        function deleteItem(idx) {
            if(confirm("確定刪除這題嗎？")) {
                db.splice(db.length - 1 - idx, 1);
                save();
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'en-US';
            ut.rate = 0.75;
            window.speechSynthesis.speak(ut);
        }

        function switchTab(name) {
            document.getElementById('listPage').classList.toggle('hidden', name !== 'list');
            document.getElementById('quizPage').classList.toggle('hidden', name !== 'quiz');
            document.getElementById('aiSection').classList.toggle('hidden', name === 'quiz');
            
            const isList = name === 'list';
            document.getElementById('tabBtnList').className = isList ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
            document.getElementById('tabBtnQuiz').className = !isList ? "flex-1 py-3 rounded-xl font-bold text-sm bg-white shadow text-indigo-600" : "flex-1 py-3 rounded-xl font-bold text-sm text-slate-500";
        }

        // --- 測驗模組 ---
        function startQuiz() {
            if (db.length === 0) return alert("題庫是空的，快去拍照！");
            currentQuizIdx = 0;
            switchTab('quiz');
            renderQuiz();
        }

        function renderQuiz() {
            const item = db[currentQuizIdx];
            const card = document.getElementById('quizCard');
            card.innerHTML = `
                <div class="text-slate-300 text-[10px] font-bold mb-6 tracking-widest uppercase">Progress ${currentQuizIdx + 1} / ${db.length}</div>
                <div class="mb-10">
                    <button onclick="speak('${item.word}')" class="w-24 h-24 bg-gradient-to-br from-indigo-500 to-blue-600 text-white rounded-full shadow-2xl mb-4 hover:scale-110 transition-transform">
                        <i class="fas fa-volume-up text-3xl"></i>
                    </button>
                    <div
